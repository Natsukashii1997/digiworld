<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逆向工程 · 2C · 孵蛋</title>
<!-- 样稿（2026-10-29 第二轮）：主角是产出。中间一台孵化器，里面是正在孵的 Skill（数码蛋 = Skill，沿用资产仓库的说法）；
     两边八个格子是这份 Skill 要有的内容，填上的亮、半格黄、空格暗。蛋上的裂纹 = 填了多少；空格一键写成追问包，够了就孵化。
     侧栏与伙伴屏原样取自项目空间 7E；只在界面上变，不写数据。 -->
<link rel="stylesheet" href="../ui-v18/common.css"><link rel="stylesheet" href="../../../src/partner-lcd.css"><link rel="stylesheet" href="v19.css"><link rel="stylesheet" href="v19-reverse.css"><link rel="stylesheet" href="v19-reverse-r2.css">
<style>
.rc-stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px minmax(0, 1fr); gap: 0 34px; align-items: start; }
.rc-col { display: grid; gap: 10px; }
.rc-slot { position: relative; display: grid; gap: 6px; min-height: 104px; box-sizing: border-box; padding: 12px 14px; border-radius: var(--r-2); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.rc-slot::after { content: ""; position: absolute; top: 50%; width: 34px; height: 0; border-top: 2px dashed rgba(140, 178, 255, .2); }
.rc-col.l .rc-slot::after { right: -35px; }
.rc-col.r .rc-slot::after { left: -35px; }
.rc-slot.full { background: #0d1a17; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lcd) 45%, transparent); }
.rc-slot.full::after { border-top: 2px solid color-mix(in srgb, var(--lcd) 70%, transparent); filter: drop-shadow(0 0 3px rgba(166, 227, 110, .6)); }
.rc-slot.half { background: #19170d; box-shadow: inset 0 0 0 1px rgba(255, 209, 102, .4); }
.rc-slot.half::after { border-top-color: rgba(255, 209, 102, .6); }
.rc-slot.empty { background: #0a0f1d; box-shadow: none; outline: 1px dashed var(--line-3); outline-offset: -1px; }
.rc-slot.ask { outline-color: var(--orange); background: #140f09; }
.rc-slot.ask::after { border-top-color: rgba(255, 138, 36, .7); }
.rc-slot.sent { outline-color: var(--cyan); background: #08161c; }
.rc-slot.sent::after { border-top-color: rgba(77, 227, 255, .7); }
.rc-sh { display: flex; align-items: center; gap: 8px; }
.rc-sh b { font: 700 14px var(--sans); }
.rc-sh .no { font: 600 10.5px var(--mono); color: var(--faint); }
.rc-st { margin-left: auto; padding: 1px 7px; border-radius: 3px; font: 600 10.5px var(--sans); }
.full .rc-st { background: color-mix(in srgb, var(--lcd) 15%, transparent); color: var(--lcd); }
.half .rc-st { background: rgba(255, 209, 102, .14); color: var(--yellow); }
.empty .rc-st { background: rgba(140, 178, 255, .08); color: var(--muted); }
.ask .rc-st { background: rgba(255, 138, 36, .16); color: var(--orange-2); }
.sent .rc-st { background: rgba(77, 227, 255, .12); color: var(--cyan); }
.rc-slot p { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--text-2); }
.rc-slot p code { font: 500 11.5px var(--mono); color: var(--text); }
.rc-slot .src { font: 500 11px var(--mono); color: var(--faint); }
.rc-slot .need { font-size: 12px; color: var(--muted); }
.rc-slot .need b { color: var(--text-2); font-weight: 600; }
.rc-slot .tg { justify-self: start; align-self: end; min-height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: 600 12px var(--sans); outline: 1px solid var(--line-2); outline-offset: -1px; cursor: pointer; }
.rc-slot .tg:hover { color: var(--text); }
.rc-slot.ask .tg { color: var(--orange-2); outline-color: rgba(255, 138, 36, .5); }
/* 孵化器 */
.rc-dev { position: relative; display: grid; justify-items: center; gap: 12px; padding: 18px 18px 20px; border-radius: 28px 28px 22px 22px; background: linear-gradient(180deg, #1a2440, #111a30 60%, #0d1427); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 0 0 1px var(--line-2), 0 24px 40px -24px rgba(0, 0, 0, .9); }
.rc-dev .top { display: flex; align-items: center; gap: 8px; align-self: stretch; }
.rc-dev .top .crest { width: 22px; height: 22px; color: var(--orange); }
.rc-dev .top .crest svg { width: 22px; height: 22px; }
.rc-dev .top .eyebrow { white-space: nowrap; }
.rc-dev .top .eyebrow:first-of-type { flex: 1; }
.rc-screen { position: relative; display: grid; place-items: center; width: 260px; height: 268px; border-radius: 14px; background: var(--m-lcd); box-shadow: inset 0 0 0 3px #0a0f1c, inset 0 6px 18px rgba(0, 0, 0, .35); overflow: hidden; }
.rc-screen::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(28, 38, 22, .07) 0 2px, transparent 2px 4px); pointer-events: none; }
.rc-screen .egg { position: relative; }
.rc-screen .readout { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; justify-content: space-between; font: 700 10.5px var(--mono); color: var(--lcd-ink); letter-spacing: .1em; }
.rc-screen .bar { position: absolute; left: 14px; right: 14px; bottom: 14px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.rc-screen .bar i { height: 8px; background: rgba(28, 38, 22, .18); }
.rc-screen .bar i.f { background: var(--lcd-ink); }
.rc-screen .bar i.h { background: linear-gradient(90deg, var(--lcd-ink) 50%, rgba(28, 38, 22, .18) 50%); }
.rc-count { display: flex; align-items: baseline; gap: 10px; }
.rc-count .lcd svg { --h: 30px; }
.rc-count small { font: 500 11.5px var(--sans); color: var(--muted); }
.rc-from { width: 100%; padding: 10px 12px; box-sizing: border-box; border-radius: 8px; background: #05080f; box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--muted); }
.rc-from b { display: block; margin-bottom: 2px; font: 600 12.5px var(--mono); color: var(--text-2); }
.rc-acts { display: grid; gap: 8px; width: 100%; }
.rc-acts .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rc-acts .rv-btn { min-height: 42px; }
.rc-acts .rv-btn.cy { background: var(--cyan); color: #032029; box-shadow: none; }
.rc-acts .rv-btn.cy:hover { background: #8aefff; }
.rc-acts .lbl { font: 600 11.5px var(--sans); color: var(--muted); text-align: center; }
.rc-acts .lbl b { color: var(--orange-2); }
.rc-hatch { background: transparent; color: var(--orange-2); box-shadow: inset 0 0 0 1px rgba(255, 138, 36, .55); }
.rc-hatch:hover { background: rgba(255, 138, 36, .1); }
.rc-born { display: grid; gap: 4px; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--violet) 10%, #0b1122); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--violet) 45%, transparent); text-align: left; }
.rc-born b { font: 700 14px var(--sans); } .rc-born small { color: var(--muted); }
.rc-foot { margin-top: 14px; font-size: 12px; color: var(--faint); text-align: center; }
.rc-pv { max-width: 760px; margin: 10px auto 0; }
.rc-pv summary { min-height: 32px; font-size: 12px; color: var(--muted); text-align: center; cursor: pointer; }
.rc-pv pre { max-height: 220px; margin: 4px 0 0; padding: 10px 12px; overflow: auto; border-radius: 6px; background: #05080f; box-shadow: inset 0 0 0 1px var(--line); font: 11.5px/1.65 var(--mono); color: var(--text-2); white-space: pre-wrap; }
@media (max-width: 760px) {
  .rc-stage { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .rc-dev { order: -1; }
  .rc-col { grid-template-columns: 1fr 1fr; gap: 8px; }
  .rc-slot { min-height: 0; padding: 10px; }
  .rc-slot::after { display: none; }
  .rc-screen { width: 220px; height: 226px; }
}
</style>

 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>资产仓库<i class="">8</i></a><a class="" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bookmark"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>个人收藏<i class="">15</i></a><a class="" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pen-line"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg>随手记<i class="">16</i></a><a class="" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>项目空间</a><a class="on" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan-line"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>逆向工程</a></nav><div class="spacer"></div><nav class="nav"><a class="" href="#"><svg xmlns="http://www.w3.org/2000/s <main>
<div class="mtop"><button class="ibtn" data-pj-navopen aria-label="打开导航"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="crumb">数码世界 / <b>逆向工程</b></span><span class="grow"></span><button class="ibtn" aria-label="搜索工作台"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></div>
<div class="top"><span class="crumb">数码世界 / <b>逆向工程</b></span><span class="search">搜索工作台<kbd>⌘K</kbd></span></div>
<div class="bar">
  <h1>逆向工程<span class="en">REVERSE ENGINEERING</span></h1>
  <div class="counts">
    <span class="cnt"><span class="lcd" data-lcd="03"></span><small>标本</small></span>
    <span class="cnt"><span class="lcd violet" data-lcd="00" data-rc-skills></span><small>已孵化</small></span>
  </div>
</div>
<nav class="rv2-switch" data-rv-switch aria-label="选择标本"></nav>

<details class="rc-pv"><summary>看追问包全文</summary><pre data-rc-pv></pre></details>
<p class="rv-draft"><span class="tag">样稿</span>10-29 正式库只读摘录：格子里的内容取自 10/16 Codex 第 2 轮结论原文；空格要的问题取自那一轮的 9 个未知。只在界面上变。</p>
</main>
<div class="rv-sheet" data-rv-sheet hidden></div>
<div class="rv-toast" data-rv-toast role="status" hidden></div>
<script src="../ui-v18/page.js"></script>
<script src="v19-reverse-r2.js"></script>
<script>
(() => {
  const { R, pack, lcd, lcds, copy, fly, partner, toast, switcher, reduced, STEP, pad2, esc, $, $$ } = RV;
  const CREST = $(".brand .mark svg")?.outerHTML || "";
  // 一份 Skill 要有的八格；need = 填上它要回答的未知
  const SLOTS = {
    r2: [
      { id: "use", name: "用途", st: "full", text: "Agent迁移和上下文接力功能", src: "你写的 · 想弄懂" },
      { id: "shape", name: "结构", st: "full", text: "两支：Agent 迁移 <code>/agents/migration</code> <code>/migration/:taskId</code> · 工作交接 <code>/agents/work-handoff</code>", src: "观察 #3 + 推断 #6" },
      { id: "data", name: "数据", st: "half", text: "候选产物 <code>migration-packages</code> <code>context-packs</code> <code>snapshots</code>；格式不知道", src: "观察 #4 · 推断 #6", need: ["u4", "u2"] },
      { id: "flow", name: "流程", st: "empty", need: ["u1", "u6"] },
      { id: "relay", name: "接力方式", st: "empty", need: ["u5"] },
      { id: "scope", name: "范围", st: "empty", need: ["u3"] },
      { id: "write", name: "写入与回滚", st: "empty", need: ["u7"] },
      { id: "check", name: "验收", st: "empty", need: ["u9"] },
    ],
  };
  const blankSlots = (r) => [{ id: "use", name: "用途", st: "full", text: esc(r.want), src: "你写的 · 想弄懂" },
    ...["结构", "数据", "流程", "接力方式", "范围", "写入与回滚", "验收"].map((name, i) => ({ id: "s" + i, name, st: "empty", need: [] }))];
  let cur = "r2", skills = 0, born = {};
  const ask = {}, sent = {};
  const rec = () => R.find((r) => r.id === cur);
  const slots = () => SLOTS[cur] || (SLOTS[cur] = blankSlots(rec()));
  const askSet = () => ask[cur] || (ask[cur] = new Set(slots().filter((s) => s.st !== "full").map((s) => s.id)));
  const sentSet = () => sent[cur] || (sent[cur] = new Set());
  const score = () => slots().reduce((a, s) => a + (s.st === "full" ? 1 : s.st === "half" ? 0.5 : 0), 0);

  // ---- 像素蛋：22×26 格；裂纹按填了多少长出来；孵化时上半截壳抬起 ----
  const W = 22, H = 26, CELL = 8;
  const inside = (x, y) => { const cy = 15, ry = 11.5, t = (y - cy) / ry; if (Math.abs(t) > 1) return false; const rx = 9.6 * (y < cy ? 0.78 + 0.22 * (1 - Math.abs(t)) : 1) * Math.sqrt(1 - t * t); return Math.abs(x + 0.5 - 11) <= rx; };
  const SPOTS = [[7, 9], [8, 9], [7, 10], [14, 13], [15, 13], [14, 14], [15, 14], [6, 18], [7, 18], [12, 21], [13, 21], [16, 19]];
  const CRACK = [[11, 4], [11, 5], [10, 6], [10, 7], [11, 8], [12, 9], [12, 10], [11, 11], [10, 12], [9, 12], [8, 13], [13, 11], [14, 12], [15, 12], [10, 13], [10, 14], [11, 15], [12, 16], [5, 14], [6, 14], [7, 13], [16, 11], [17, 12], [12, 17]];
  const ZIG = (x) => 11 + (x % 4 < 2 ? 0 : 1);
  function egg(progress, hatched, lift = 0) {
    const n = Math.round(CRACK.length * Math.min(1, progress)), crack = new Set(CRACK.slice(0, n).map(([x, y]) => `${x},${y}`));
    let s = "";
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!inside(x, y)) continue;
      const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
      const top = hatched && y < ZIG(x);
      const dy = top ? -lift : 0, dx = top ? -Math.round(lift / 2) : 0;
      const fill = edge || (hatched && (y === ZIG(x) || y === ZIG(x) - 1) && lift > 0) ? "var(--px-ink)" : crack.has(`${x},${y}`) && !hatched ? "var(--px-ink)" : SPOTS.some(([a, b]) => a === x && b === y) ? "var(--px-egg-spot)" : "var(--px-egg)";
      s += `<rect x="${(x + dx) * CELL}" y="${(y + dy + 3) * CELL}" width="${CELL}" height="${CELL}" fill="${fill}"/>`;
    }
    if (hatched && lift > 2) for (const [x, y] of [[4, 4], [18, 5], [3, 12], [19, 11]]) s += `<rect x="${x * CELL}" y="${y * CELL}" width="${CELL}" height="${CELL}" fill="var(--lcd-ink)"/>`;
    return `<svg class="egg" viewBox="0 0 ${W * CELL} ${(H + 3) * CELL}" width="${W * CELL * 0.8}" height="${(H + 3) * CELL * 0.8}" style="margin-top:-8px" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
  }

  function slotHtml(s, i) {
    const a = askSet().has(s.id), sn = sentSet().has(s.id), r = rec();
    const cls = s.st === "full" ? "full" : sn ? `${s.st} sent` : a ? `${s.st} ask` : s.st;
    const stt = s.st === "full" ? "填上了" : sn ? "在问" : a ? (s.st === "half" ? "半格 · 要问" : "空 · 要问") : s.st === "half" ? "半格" : "空";
    const need = (s.need || []).map((id) => r.unknown.find((u) => u.id === id)?.short).filter(Boolean);
    const body = s.text ? `<p>${s.text}</p>` : "";
    const src = s.src ? `<span class="src">${esc(s.src)}</span>` : "";
    const one = (s.need || []).length === 1 ? r.unknown.find((u) => u.id === s.need[0])?.q : "";
    const needLine = s.st !== "full" ? `<span class="need">${one ? `要问：<b>${esc(one)}</b>` : need.length ? `缺：<b>${esc(need.join("、"))}</b>` : "还没有任何结论"}</span>` : "";
    const tg = s.st !== "full" && !sn ? `<button class="tg" data-rc-ask="${s.id}" aria-pressed="${a}">${a ? "✓ 放进追问" : "＋ 放进追问"}</button>` : "";
    return `<article class="rc-slot ${cls}" data-slot="${s.id}"><div class="rc-sh"><span class="no">${pad2(i + 1)}</span><b>${esc(s.name)}</b><span class="rc-st">${stt}</span></div>${body}${src}${needLine}${tg}</article>`;
  }
  function devHtml() {
    const r = rec(), sc = score(), fl = slots().filter((s) => s.st === "full").length, hf = slots().filter((s) => s.st === "half").length;
    const asks = slots().filter((s) => askSet().has(s.id) && !sentSet().has(s.id)), last = r.rounds.at(-1), n = r.rounds.length + 1;
    const barCells = slots().map((s) => `<i class="${s.st === "full" ? "f" : s.st === "half" ? "h" : ""}"></i>`).join("");
    const b = born[cur];
    return `<div class="rc-dev"><div class="top"><span class="crest">${CREST}</span><span class="eyebrow"><b>SKILL</b> 孵化器</span><span class="eyebrow">${b ? "HATCHED" : "INCUBATING"}</span></div>` +
      `<div class="rc-screen" data-rc-screen><div class="readout"><span>${b ? "已孵化" : "孵化中"}</span><span>${fl}${hf ? "+½" : ""} / 8</span></div>${egg(sc / 8, !!b, b ? 4 : 0)}<div class="bar">${barCells}</div></div>` +
      `<div class="rc-count"><span class="lcd" data-lcd="${pad2(fl)}"></span><small>格填上${hf ? ` · ${hf} 格半` : ""} · ${8 - fl - hf} 格空</small></div>` +
      `<div class="rc-from"><b>${esc(r.nick)} · ${esc(r.src)}</b>${last ? `第 ${last.n} 轮 · ${last.at} · ${esc(last.by)} · ${esc(last.statusText)}` : "还没交出过"}</div>` +
      (b ? `<div class="rc-born"><span class="rv-chip">SKILL</span><b>${esc(b)}</b><small>固定版本 v1 · 空着的格写进「局限」· 未经复刻验证</small></div>`
        : `<div class="rc-acts"><span class="lbl">把 <b>${asks.length} 格</b>写成第 ${n} 轮追问包</span><div class="row"><button class="rv-btn cy" data-rc-copy="Codex">复制给 Codex</button><button class="rv-btn" data-rc-copy="Claude Code">复制给 Claude Code</button></div>` +
          `<button class="rv-btn rc-hatch" data-rc-hatch>现在就孵化（存成 Skill）</button></div>`) + `</div>`;
  }
  function questions() {
    const r = rec(), ids = slots().filter((s) => askSet().has(s.id) && !sentSet().has(s.id)).flatMap((s) => s.need || []);
    return r.unknown.filter((u) => ids.includes(u.id)).map((u) => u.q);
  }
  function draw() {
    const ss = slots();
    $("[data-rc-stage]").innerHTML = `<div class="rc-col l">${ss.slice(0, 4).map(slotHtml).join("")}</div>${devHtml()}<div class="rc-col r">${ss.slice(4).map((s, i) => slotHtml(s, i + 4)).join("")}</div>`;
    $("[data-rc-pv]").textContent = pack(rec(), questions());
    lcds($("[data-rc-stage]"));
  }

  async function hatch(name, btn) {
    const sc = score();
    $("[data-rv-sheet]").hidden = true;
    const scr = $("[data-rc-screen] .egg");
    if (!reduced && scr) {
      for (const p of [sc / 8 + 0.2, sc / 8 + 0.45, 1]) { scr.outerHTML = egg(p, false); await new Promise((ok) => setTimeout(ok, 110)); }
      for (const l of [1, 2, 3, 4]) { $("[data-rc-screen] .egg").outerHTML = egg(1, true, l); await new Promise((ok) => setTimeout(ok, 90)); }
    }
    born[cur] = name; skills++;
    draw();
    await fly($("[data-rc-screen]"), partner(), "#a891ff"); dispatchEvent(new Event("guiji:data-caught"));
    lcd($("[data-rc-skills]"), pad2(skills), true);
    toast(`孵出来了：Skill「${name}」。样稿，不写数据。`);
  }

  document.addEventListener("click", async (e) => {
    const t = e.target;
    const a = t.closest("[data-rc-ask]");
    if (a) { const s = askSet(), id = a.dataset.rcAsk; s.has(id) ? s.delete(id) : s.add(id); draw(); return; }
    const cp = t.closest("[data-rc-copy]");
    if (cp) {
      const qs = questions();
      await copy(cp, pack(rec(), qs), cp.dataset.rcCopy);
      for (const s of slots()) if (askSet().has(s.id)) sentSet().add(s.id);
      askSet().clear(); draw();
      toast(`第 ${rec().rounds.length + 1} 轮追问包已复制（${qs.length || "完整取证"}${qs.length ? " 个问题" : ""}）。对应的格子标成「在问」。`);
      return;
    }
    if (t.closest("[data-rc-hatch]")) {
      const fl = slots().filter((s) => s.st === "full").length, hf = slots().filter((s) => s.st === "half").length, emp = 8 - fl - hf;
      const sh = $("[data-rv-sheet]");
      sh.innerHTML = `<div class="rv-sheet-in" role="dialog" aria-label="孵化预览"><header><h3>孵化 · 预览</h3><button class="ibtn" data-x aria-label="关闭">×</button></header>` +
        `<label>名字<input value="Agent 迁移与工作交接 · 拆解" data-rc-name></label>` +
        `<dl><dt>已填</dt><dd>${fl} 格${hf ? ` + ${hf} 格半` : ""}（${esc(slots().filter((s) => s.st !== "empty").map((s) => s.name).join("、"))}）</dd><dt>局限</dt><dd>空着的 ${emp} 格写进 Skill 的「局限」</dd>` +
        `<dt>版本</dt><dd>固定版本 v1 · 写入后回读核对</dd><dt>验证</dt><dd class="warn">未经复刻验证</dd></dl>` +
        `<p class="hint">格子填得越满，孵出来的 Skill 越能直接用；现在孵也可以，以后再孵一版新的。</p>` +
        `<div class="rv-acts"><button class="rv-btn pri" data-rc-confirm>确认孵化</button><button class="rv-btn ghost" data-x>取消</button></div></div>`;
      sh.hidden = false; return;
    }
    if (t.closest("[data-rc-confirm]")) return hatch($("[data-rc-name]").value || "未命名 Skill", t);
    if (t.closest("[data-x]") || t.matches("[data-rv-sheet]")) $("[data-rv-sheet]").hidden = true;
  });
  switcher(() => cur, (id) => { cur = id; draw(); });
  lcds(document, true);
  draw();
})();
</script>
