<html lang="zh-CN">

<title>逆向工程 · 2A · 透视图</title>
<!-- 样稿（2026-10-29 第二轮）：主角是参照物本身——拆到哪了、哪里还黑着。看清的部件亮（绿 = 观察，紫虚线 = 推断），
     9 个未知是黑着的雾点；点雾点把它放进下一轮追问包。侧栏与伙伴屏原样取自项目空间 7E；只在界面上变，不写数据。 -->
<link rel="stylesheet" href="../ui-v18/common.css"><link rel="stylesheet" href="../../../src/partner-lcd.css"><link rel="stylesheet" href="v19.css"><link rel="stylesheet" href="v19-reverse.css"><link rel="stylesheet" href="v19-reverse-r2.css">
<style>
.xa-stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.xa-map { position: relative; overflow: hidden; padding: 16px 18px 12px; border-radius: var(--r-2); background:
  radial-gradient(circle at 1px 1px, rgba(140, 178, 255, 0.09) 1px, transparent 1.4px) 0 0 / 18px 18px, var(--m-screen); box-shadow: var(--m-screen-edge), inset 0 0 0 1px var(--line-2); }
.xa-mhead { display: flex; align-items: center; gap: 12px; }
.xa-mhead h2 { margin: 0; font: 800 20px var(--sans); }
.xa-mhead .src { font: 500 12.5px var(--mono); color: var(--muted); }
.xa-legend { display: flex; gap: 14px; margin-left: auto; font-size: 12px; color: var(--muted); }
.xa-legend span { display: inline-flex; align-items: center; gap: 6px; }
.xa-legend i { width: 10px; height: 10px; border-radius: 2px; }
.xa-legend .o { background: var(--lcd); } .xa-legend .p { outline: 1.5px dashed var(--violet); outline-offset: -1.5px; } .xa-legend .u { border-radius: 50%; background: #10172b; box-shadow: inset 0 0 0 1px var(--line-3); }
.xa-svg { display: block; width: 100%; height: auto; margin-top: 4px; }
.xa-svg text { font-family: var(--mono); }
.xa-svg .edge { fill: none; stroke: color-mix(in srgb, var(--lcd) 55%, transparent); stroke-width: 1.4; }
.xa-svg .edge.p { stroke: color-mix(in srgb, var(--violet) 70%, transparent); stroke-dasharray: 5 4; }
.xa-svg .edge.x { stroke: rgba(140, 178, 255, 0.22); stroke-dasharray: 2 4; }
.xa-svg .edge.t { stroke: rgba(140, 178, 255, 0.14); stroke-dasharray: 1 5; }
.xa-svg .node { cursor: pointer; }
.xa-svg .node:focus { outline: none; }
.xa-svg .node rect { fill: #0b1a17; stroke: color-mix(in srgb, var(--lcd) 70%, transparent); stroke-width: 1.2; }
.xa-svg .node .k { fill: var(--lcd); font-size: 9px; letter-spacing: .12em; }
.xa-svg .node .n { fill: var(--text); font-size: 12px; }
.xa-svg .node.p rect { fill: #151231; stroke: var(--violet); stroke-dasharray: 5 3; }
.xa-svg .node.p .k { fill: var(--violet); }
.xa-svg .node.p .n { font-family: var(--sans); font-weight: 700; font-size: 13.5px; }
.xa-svg .node.c rect { fill: #0f1729; stroke: var(--orange); stroke-width: 1.6; filter: drop-shadow(0 0 10px rgba(255, 138, 36, .35)); }
.xa-svg .node.c .k { fill: var(--orange-2); }
.xa-svg .node.c .n { font-family: var(--sans); font-weight: 800; font-size: 17px; }
.xa-svg .node:hover rect, .xa-svg .node.sel rect { stroke-width: 2.2; filter: drop-shadow(0 0 8px rgba(166, 227, 110, .55)); }
.xa-svg .node.p:hover rect, .xa-svg .node.p.sel rect { filter: drop-shadow(0 0 8px rgba(168, 145, 255, .6)); }
.xa-svg .fog circle.f { fill: #0c1222; stroke: rgba(140, 178, 255, 0.28); stroke-width: 1; }
.xa-svg .fog .h { fill: url(#xa-haze); }
.xa-svg .fog .q { fill: var(--muted); font: 700 15px var(--sans); }
.xa-svg .fog .l { fill: var(--faint); font: 500 11px var(--sans); }
.xa-svg .fog:hover circle.f { stroke: var(--text-2); }
.xa-svg .fog.ask circle.f { fill: #2a1606; stroke: var(--orange); stroke-width: 1.8; filter: drop-shadow(0 0 8px rgba(255, 138, 36, .6)); }
.xa-svg .fog.ask .q { fill: var(--orange-2); }
.xa-svg .fog.ask .l { fill: var(--orange-2); }
.xa-svg .fog.sent circle.f { stroke: var(--cyan); stroke-dasharray: 3 3; fill: #071d24; }
.xa-svg .fog.sent .q, .xa-svg .fog.sent .l { fill: var(--cyan); }
.xa-blank { display: grid; place-items: center; min-height: 420px; text-align: center; color: var(--muted); font-size: 13px; }
.xa-blank b { display: block; margin: 14px 0 4px; font: 700 16px var(--sans); color: var(--text-2); }
.xa-mfoot { display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
.xa-mfoot b { color: var(--text-2); font-weight: 600; }

.xa-side { display: grid; gap: 12px; }
.xa-card { padding: 14px 16px; border-radius: var(--r-2); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.xa-card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 700 11.5px var(--mono); letter-spacing: .14em; color: var(--muted); }
.xa-card h3 .grow { flex: 1; }
.xa-lit { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 10px; }
.xa-lit .lcd svg { --h: 34px; }
.xa-lit small { display: block; font: 500 11px var(--mono); color: var(--muted); }
.xa-lit .of { font: 700 14px var(--mono); color: var(--faint); margin-bottom: 4px; }
.xa-ev { min-height: 92px; }
.xa-ev .m { display: inline-block; margin-right: 8px; padding: 1px 6px; border-radius: 3px; font: 600 10.5px var(--sans); }
.xa-ev .m.o { background: color-mix(in srgb, var(--lcd) 14%, transparent); color: var(--lcd); }
.xa-ev .m.p { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet); }
.xa-ev .m.u { background: rgba(140, 178, 255, .08); color: var(--muted); }
.xa-ev b { font: 700 14px var(--mono); }
.xa-ev p { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--text-2); }
.xa-ev .tip { margin: 0; font-size: 12.5px; color: var(--faint); }
.xa-q { display: grid; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; counter-reset: q; }
.xa-q li { display: grid; grid-template-columns: 20px minmax(0, 1fr) 28px; align-items: start; gap: 6px; font-size: 12.5px; line-height: 1.55; color: var(--text-2); counter-increment: q; }
.xa-q li::before { content: counter(q); font: 700 11px/20px var(--mono); color: var(--orange-2); }
.xa-q li button { width: 28px; height: 28px; margin-top: -4px; border: 0; border-radius: 6px; background: none; color: var(--faint); cursor: pointer; }
.xa-q li button:hover { color: var(--text); background: rgba(233, 238, 255, .06); }
.xa-q .none { display: block; color: var(--faint); }
.xa-q .none::before { content: none; }
.xa-card .rv-acts { margin-top: 6px; }
.xa-card .rv-acts .rv-btn { flex: 1; }
.xa-card .rv-btn.cy { background: var(--cyan); color: #032029; box-shadow: none; }
.xa-card .rv-btn.cy:hover { background: #8aefff; }
.xa-pv summary { min-height: 32px; font-size: 12px; color: var(--muted); cursor: pointer; }
.xa-pv pre { max-height: 180px; margin: 4px 0 0; padding: 10px 12px; overflow: auto; border-radius: 6px; background: #05080f; box-shadow: inset 0 0 0 1px var(--line); font: 11.5px/1.65 var(--mono); color: var(--text-2); white-space: pre-wrap; }
.xa-harvest p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.xa-harvest p b { color: var(--text-2); }
.xa-harvest .rv-btn { width: 100%; }
.xa-done { display: grid; gap: 4px; padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--violet) 8%, #0b1122); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--violet) 40%, transparent); }
.xa-done b { font: 700 14px var(--sans); }
.xa-done small { color: var(--muted); }
@media (max-width: 760px) {
  .xa-stage { grid-template-columns: minmax(0, 1fr); }
  .xa-map { margin: 0 -16px; border-radius: 0; padding: 12px 10px 10px; overflow-x: auto; }
  .xa-svg { width: 700px; max-width: none; }
  .xa-mhead { flex-wrap: wrap; }
  .xa-legend { width: 100%; margin: 4px 0 0; }

 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>资产仓库<i class="">8</i></a><a class="" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bookmark"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>个人收藏<i class="">15</i></a><a class="" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pen-line"><path d="M12 20h9"></path><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"></path></svg>随手记<i class="">16</i></a><a class="" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>项目空间</a><a class="on" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan-line"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>逆向工程</a></nav><div class="spacer"></div><nav class="nav"><a class="" href="#"><svg xmlns="http://www.w3.org/2000/s <main>
<div class="mtop"><button class="ibtn" data-pj-navopen aria-label="打开导航"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="crumb">数码世界 / <b>逆向工程</b></span><span class="grow"></span><button class="ibtn" aria-label="搜索工作台"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></div>
<div class="top"><span class="crumb">数码世界 / <b>逆向工程</b></span><span class="search">搜索工作台<kbd>⌘K</kbd></span></div>
<div class="bar">
  <h1>逆向工程<span class="en">REVERSE ENGINEERING</span></h1>
  <div class="counts">
    <span class="cnt"><span class="lcd" data-lcd="03"></span><small>标本</small></span>
    <span class="cnt"><span class="lcd violet" data-lcd="00" data-xa-skills></span><small>已收成</small></span>
  </div>
</div>
<nav class="rv2-switch" data-rv-switch aria-label="选择标本"></nav>
<div class="xa-stage">
  <section class="xa-map" data-xa-map aria-label="透视图"></section>
  <aside class="xa-side" data-xa-side></aside>
</div>
<p class="rv-draft"><span class="tag">样稿</span>10-29 正式库只读摘录：部件与未知取自 10/16 Codex 第 2 轮结论原文。点亮的部件看证据，点雾点加进追问；只在界面上变。</p>
</main>
<div class="rv-sheet" data-rv-sheet hidden></div>
<div class="rv-toast" data-rv-toast role="status" hidden></div>
<script src="../ui-v18/page.js"></script>
<script src="v19-reverse-r2.js"></script>
<script>
(() => {
  const { R, pack, lcds, copy, fly, partner, toast, switcher, reduced, STEP, pad2, esc, $, $$ } = RV;
  let cur = "r2", sel = null, skills = 0;
  const ask = new Set(["u1", "u5", "u4"]), sent = new Set();
  const rec = () => R.find((r) => r.id === cur);

  // 部件位置（viewBox 760×470）：中心是参照物，两支推断出的分支，分支下面是看到的路由和接口；没归属的接口在底下，未知是外圈的雾点
  const POS = {
    c: [380, 235, 196, 62],
    "k-br-m": [190, 160, 130, 40], "k-br-h": [570, 160, 130, 40],
    "k-route-m": [100, 56, 184, 38], "k-route-t": [306, 56, 214, 38], "k-route-h": [610, 56, 200, 38],
    "k-api-mp": [184, 318, 176, 38], "k-api-cp": [612, 318, 152, 38],
    "k-api-sn": [272, 418, 130, 38], "k-api-cf": [432, 418, 148, 38], "k-api-sd": [612, 418, 170, 38],
  };
  const EDGES = [["c", "k-br-m", "p"], ["c", "k-br-h", "p"], ["k-br-m", "k-route-m"], ["k-br-m", "k-route-t"], ["k-br-m", "k-api-mp"],
    ["k-br-h", "k-route-h"], ["k-br-h", "k-api-cp"], ["c", "k-api-sn", "x"], ["c", "k-api-cf", "x"], ["c", "k-api-sd", "x"]];
  const FOG = { u1: [456, 132, "k-route-t"], u6: [330, 150, "k-route-t"], u3: [50, 160, "k-br-m"], u4: [48, 250, "k-api-mp"], u2: [380, 338, "c"],
    u7: [140, 420, "k-api-sn"], u5: [716, 160, "k-br-h"], u8: [530, 246, "c"], u9: [716, 248, "k-api-cp"] };

  function node(id, cls, kind, name) {
    const [x, y, w, h] = POS[id];
    return `<g class="node ${cls}${sel === id ? " sel" : ""}" data-node="${id}" tabindex="0" role="button" aria-label="${esc(name)}">` +
      `<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${cls === "c" ? 9 : 6}"/>` +
      `<text class="k" x="${x}" y="${y - h / 2 + 13}" text-anchor="middle">${esc(kind)}</text>` +
      `<text class="n" x="${x}" y="${y + h / 2 - (cls === "c" ? 13 : 9)}" text-anchor="middle">${esc(name)}</text></g>`;
  }
  const mid = (a) => POS[a].slice(0, 2);
  function edge([a, b, cls = ""]) {
    const [x1, y1] = mid(a), [x2, y2] = mid(b), my = (y1 + y2) / 2;
    return `<path class="edge ${cls}" d="M${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}"/>`;
  }
  function drawMap() {
    const r = rec(), m = $("[data-xa-map]");
    const head = `<div class="xa-mhead"><span class="rv-kind">${r.kind === "web" ? "网站" : "本机文件"}</span><h2>${esc(r.nick)}</h2><span class="src">${esc(r.src)}</span>` +
      `<div class="xa-legend"><span><i class="o"></i>看到的</span><span><i class="p"></i>推断的</span><span><i class="u"></i>还黑着</span></div></div>`;
    if (!r.known.length) {
      const last = r.rounds.at(-1);
      m.innerHTML = head + `<div class="xa-blank"><div><svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="xa-h0"><stop offset="0" stop-color="#1a2440"/><stop offset="1" stop-color="#1a2440" stop-opacity="0"/></radialGradient></defs><circle cx="60" cy="60" r="58" fill="url(#xa-h0)"/><circle cx="60" cy="60" r="30" fill="#0c1222" stroke="rgba(140,178,255,.3)"/><text x="60" y="68" text-anchor="middle" fill="#8b98b8" font-size="24" font-weight="700">?</text></svg>` +
        `<b>整件还黑着</b>${last ? esc(`${last.at} ${last.statusText}`) : "还没交出过"}</div></div>` +
        `<div class="xa-mfoot"><span>想弄懂：<b>${esc(r.want)}</b></span></div>`;
      return;
    }
    const known = r.known, fogs = r.unknown;
    let s = `<svg class="xa-svg" viewBox="0 0 760 470" role="group" aria-label="${esc(r.nick)} 的透视图"><defs><radialGradient id="xa-haze"><stop offset="0" stop-color="#1b2645" stop-opacity=".9"/><stop offset="1" stop-color="#1b2645" stop-opacity="0"/></radialGradient></defs>`;
    for (const u of fogs) { const [x, y, to] = FOG[u.id], [tx, ty] = mid(to); s += `<path class="edge t" d="M${x} ${y} L${tx} ${ty}"/>`; }
    s += EDGES.map(edge).join("");
    for (const u of fogs) {
      const [x, y] = FOG[u.id], c = ask.has(u.id) ? " ask" : sent.has(u.id) ? " sent" : "";
      s += `<g class="node fog${c}" data-fog="${u.id}" tabindex="0" role="button" aria-pressed="${ask.has(u.id)}" aria-label="未知：${esc(u.short)}">` +
        `<circle class="h" cx="${x}" cy="${y}" r="36"/><circle class="f" cx="${x}" cy="${y}" r="17"/><text class="q" x="${x}" y="${y + 5}" text-anchor="middle">${sent.has(u.id) ? "…" : "?"}</text>` +
        `<text class="l" x="${x}" y="${y + 33}" text-anchor="middle">${esc(u.short)}</text></g>`;
    }
    s += node("c", "c", "参照物 · 炉子", "app.luzi.top/agents");
    for (const k of known) s += node(k.id, k.mark === "推断" ? "p" : "o", k.kind === "分支" ? "推断 · 功能分支" : k.kind, k.name);
    s += `</svg>`;
    const r2 = r.rounds.at(-1);
    m.innerHTML = head + s + `<div class="xa-mfoot"><span>第 ${r2.n} 轮 · ${r2.at} · ${esc(r2.by)}</span><span>·</span><span>${esc(r2.statusText)}</span></div>`;
    if (!drawMap.lit && !reduced) {
      drawMap.lit = true;
      $$(".xa-svg .node:not(.fog)", m).forEach((g, i) => g.animate([{ opacity: 0, ...STEP }, { offset: 0.5, opacity: 0.4, ...STEP }, { opacity: 1 }], { duration: 160, delay: 120 + i * 55, fill: "backwards" }));
    }
  }

  function drawSide() {
    const r = rec(), side = $("[data-xa-side]");
    const o = r.known.filter((k) => k.mark === "观察").length, p = r.known.filter((k) => k.mark === "推断").length, u = r.unknown.length, total = o + p + u;
    const qs = r.unknown.filter((x) => ask.has(x.id));
    const k = r.known.find((x) => x.id === sel), f = r.unknown.find((x) => x.id === sel);
    const ev = k ? `<span class="m ${k.mark === "推断" ? "p" : "o"}">${k.mark}</span><b>${esc(k.name)}</b><p>${esc(k.text)}</p>`
      : f ? `<span class="m u">未知</span><b>${esc(f.short)}</b><p>${esc(f.q)}</p>`
      : `<p class="tip">点一个亮着的部件看证据；点一个雾点，把它放进下一轮要问的问题。</p>`;
    const n = r.rounds.length + 1;
    side.innerHTML =
      `<section class="xa-card"><h3>照亮了多少</h3>` + (total ? `<div class="xa-lit"><span class="lcd" data-lcd="${pad2(o + p)}"></span><span class="of">/ ${pad2(total)}</span>` +
        `<span><small>看到 ${o} · 推断 ${p} · 未知 ${u}</small></span></div><div class="rv2-cells" aria-hidden="true">${"<i class=o></i>".repeat(o)}${"<i class=p></i>".repeat(p)}${r.unknown.map((x) => `<i class="${ask.has(x.id) ? "q" : "u"}"></i>`).join("")}</div>`
        : `<div class="xa-lit"><span class="lcd dim" data-lcd="00"></span><span><small>还没有回来过结论</small></span></div>`) + `</section>` +
      `<section class="xa-card xa-ev" aria-live="polite"><h3>${k ? "证据" : f ? "要问的" : "部件"}</h3>${ev}</section>` +
      `<section class="xa-card"><h3>第 ${n} 轮要问 <span class="grow"></span><span class="lcd orange" data-lcd="${pad2(qs.length)}"></span></h3>` +
        (r.unknown.length ? `<ol class="xa-q">${qs.map((x) => `<li>${esc(x.q)}<button data-unask="${x.id}" aria-label="不问这条">×</button></li>`).join("") || `<li class="none">从左边点雾点，加进来。</li>`}</ol>`
          : `<ol class="xa-q"><li class="none">${r.rounds.length ? "上一轮没拿到结论，这一轮再做一次完整取证。" : "第一轮：做一次完整取证。"}</li></ol>`) +
        `<div class="rv-acts"><button class="rv-btn cy" data-xa-copy="Codex">复制给 Codex</button><button class="rv-btn" data-xa-copy="Claude Code">复制给 Claude Code</button></div>` +
        `<details class="xa-pv"><summary>看追问包全文</summary><pre>${esc(pack(r, qs.map((x) => x.q)))}</pre></details></section>` +
      `<section class="xa-card xa-harvest"><h3>收成</h3>` + (skills ? `<div class="xa-done"><span class="rv-chip">SKILL</span><b>Agent 迁移与工作交接 · 拆解</b><small>固定版本 v1 · 写明 ${u} 处还黑着</small></div>`
        : r.known.length ? `<p>已经照亮的 <b>${o + p} 个部件</b>可以先存成 Skill；还黑着的 ${u} 处会写进「局限」，不算复刻验证。</p><button class="rv-btn pri" data-xa-save>把照亮的部分存成 Skill</button>`
        : `<p>还没有照亮的部件，先交出去。</p>`) + `</section>`;
    lcds(side);
  }
  const draw = () => { drawMap(); drawSide(); };

  document.addEventListener("click", async (e) => {
    const t = e.target;
    const fog = t.closest("[data-fog]");
    if (fog) { const id = fog.dataset.fog; sent.delete(id); ask.has(id) ? ask.delete(id) : ask.add(id); sel = id; draw(); return; }
    const nd = t.closest("[data-node]");
    if (nd) { sel = nd.dataset.node === "c" ? null : nd.dataset.node; draw(); return; }
    const un = t.closest("[data-unask]");
    if (un) { ask.delete(un.dataset.unask); draw(); return; }
    const cp = t.closest("[data-xa-copy]");
    if (cp) {
      const r = rec(), qs = r.unknown.filter((x) => ask.has(x.id));
      await copy(cp, pack(r, qs.map((x) => x.q)), cp.dataset.xaCopy);
      for (const x of qs) { ask.delete(x.id); sent.add(x.id); }
      draw(); toast(`第 ${r.rounds.length + 1} 轮追问包已复制（${qs.length} 个问题）。这几个雾点标成「在问」。`);
      return;
    }
    if (t.closest("[data-xa-save]")) {
      const b = t.closest("[data-xa-save]");
      await fly(b, partner(), "#a891ff"); dispatchEvent(new Event("guiji:data-caught"));
      skills = 1; const el = $("[data-xa-skills]"); el.dataset.lcd = "01"; lcds(document, false); RV.lcd(el, "01", true);
      draw(); toast("已存成 Skill（样稿，不写数据）。");
    }
  });
  document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".xa-svg .node")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
  switcher(() => cur, (id) => { cur = id; sel = null; drawMap.lit = false; draw(); });
  lcds(document, true);
  draw();
})();
</script>
