<title>逆向工程 · 3C · 孵蛋精修</title>
<!-- 样稿（2026-10-29 第三轮，2C 精修）：主角仍是产出的 Skill。这一版的细节：
     ① 八格与孵化器两侧八个接口灯一一对齐：填上绿、半格黄、空格不亮，连线接到灯上。
     ② 哪格填上，蛋的哪一侧就裂开一道（左四格裂左边，右四格裂右边）；半格裂一半。
     ③ 格子写明「会写进 Skill 的原文」；半格分「已知 / 缺」；空格直接写要问的问题。空格默认安静，选中只加一道橙色左边。
     ④ 孵化器里有两轮的进度对比；孵化前预览 Skill 草稿全文。侧栏与伙伴屏原样取自项目空间 7E；只在界面上变，不写数据。 -->
<link rel="stylesheet" href="../ui-v18/common.css"><link rel="stylesheet" href="../../../src/partner-lcd.css"><link rel="stylesheet" href="v19.css"><link rel="stylesheet" href="v19-reverse.css"><link rel="stylesheet" href="v19-reverse-r2.css">
<style>
.rc-src { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 10px 14px; border-radius: var(--r-2); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; color: var(--muted); }
.rc-src h2 { margin: 0; font: 800 17px var(--sans); color: var(--text); }
.rc-src code { font: 500 12px var(--mono); color: var(--muted); }
.rc-src .sep { color: var(--line-3); }
.rc-src b { color: var(--text-2); font-weight: 600; }
.rc-src .grow { flex: 1; }
.rc-src button { min-height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--muted); font: 500 12px var(--sans); outline: 1px dashed var(--line-3); outline-offset: -1px; cursor: pointer; }
.rc-stage { --sh: 150px; --sg: 10px; display: grid; grid-template-columns: minmax(0, 1fr) 330px minmax(0, 1fr); gap: 0 36px; align-items: start; }
.rc-col { display: grid; grid-auto-rows: var(--sh); gap: var(--sg); }
.rc-slot { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; box-sizing: border-box; padding: 11px 14px 10px; border-radius: var(--r-2); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); overflow: visible; }
.rc-slot::after { content: ""; position: absolute; top: 50%; width: 36px; height: 0; border-top: 2px dashed rgba(140, 178, 255, .16); }
.rc-col.l .rc-slot::after { right: -37px; }
.rc-col.r .rc-slot::after { left: -37px; }
.rc-slot.full { background: #0d1a17; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lcd) 42%, transparent); }
.rc-slot.full::after { border-top: 2px solid color-mix(in srgb, var(--lcd) 75%, transparent); filter: drop-shadow(0 0 3px rgba(166, 227, 110, .6)); }
.rc-slot.half { background: #17160e; box-shadow: inset 0 0 0 1px rgba(255, 209, 102, .34); }
.rc-slot.half::after { border-top: 2px solid rgba(255, 209, 102, .55); }
.rc-slot.empty { background: #0a0f1d; box-shadow: none; outline: 1px dashed var(--line-2); outline-offset: -1px; }
.rc-slot.ask { box-shadow: inset 3px 0 0 var(--orange), inset 0 0 0 1px var(--line); }
.rc-slot.empty.ask { outline: 0; box-shadow: inset 3px 0 0 var(--orange), inset 0 0 0 1px var(--line-2); }
.rc-slot.half.ask { box-shadow: inset 3px 0 0 var(--orange), inset 0 0 0 1px rgba(255, 209, 102, .34); }
.rc-slot.sent { box-shadow: inset 3px 0 0 var(--cyan), inset 0 0 0 1px var(--line-2); outline: 0; }
.rc-sh { display: flex; align-items: center; gap: 8px; }
.rc-sh b { font: 700 14px var(--sans); }
.rc-sh .no { font: 600 10.5px var(--mono); color: var(--faint); }
.rc-st { margin-left: auto; padding: 1px 7px; border-radius: 3px; font: 600 10.5px var(--sans); white-space: nowrap; }
.full .rc-st { background: color-mix(in srgb, var(--lcd) 15%, transparent); color: var(--lcd); }
.half .rc-st { background: rgba(255, 209, 102, .14); color: var(--yellow); }
.empty .rc-st { background: rgba(140, 178, 255, .07); color: var(--faint); }
.sent .rc-st { background: rgba(77, 227, 255, .12); color: var(--cyan); }
.rc-body { min-height: 0; overflow: hidden; }
.rc-body .lb { display: block; margin-bottom: 2px; font: 600 10px var(--mono); letter-spacing: .12em; color: var(--faint); }
.full .rc-body .lb { color: color-mix(in srgb, var(--lcd) 70%, transparent); }
.rc-body p { display: -webkit-box; margin: 0; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; font-size: 12.5px; line-height: 1.5; color: var(--text-2); }
.rc-body p code { font: 500 11.5px var(--mono); color: var(--text); }
.rc-body .kn { -webkit-line-clamp: 1; }
.rc-body .kn::before { content: "✓ "; color: var(--lcd); }
.rc-body .ms { -webkit-line-clamp: 2; color: var(--muted); }
.rc-body .ms::before { content: "? "; font-weight: 700; color: var(--yellow); }
.empty .rc-body p { -webkit-line-clamp: 3; color: var(--muted); }
.empty .rc-body p::before { content: "? "; font-weight: 700; color: var(--faint); }
.rc-ft { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.rc-ft .src { font: 500 11px var(--mono); color: var(--faint); }
.rc-tg { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; margin-left: auto; padding: 0 2px; border: 0; background: none; color: var(--muted); font: 600 12px var(--sans); cursor: pointer; }
.rc-tg i { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--line-3); font: 700 10px/1 var(--sans); font-style: normal; color: transparent; }
.rc-tg[aria-pressed="true"] { color: var(--orange-2); }
.rc-tg[aria-pressed="true"] i { background: var(--orange); box-shadow: none; color: var(--orange-ink); }
.rc-tg:hover { color: var(--text); }
/* 孵化器 */

.rc-port { position: absolute; width: 10px; height: 16px; margin-top: -8px; border-radius: 3px; background: #05080f; box-shadow: inset 0 0 0 1px var(--line-2); }
.rc-port.l { left: -5px; } .rc-port.r { right: -5px; }
.rc-port.full { background: var(--lcd); box-shadow: 0 0 8px rgba(166, 227, 110, .8); }
.rc-port.half { background: linear-gradient(180deg, #05080f 50%, var(--yellow) 50%); box-shadow: 0 0 6px rgba(255, 209, 102, .5); }
.rc-port.sent { background: #071d24; box-shadow: inset 0 0 0 1.5px var(--cyan); }
.rc-dev .top { display: flex; align-items: center; gap: 8px; align-self: stretch; }
.rc-dev .top .crest svg { width: 20px; height: 20px; color: var(--orange); }
.rc-dev .top .eyebrow { white-space: nowrap; }
.rc-dev .top .eyebrow:first-of-type { flex: 1; }
.rc-screen { position: relative; display: grid; place-items: center; width: 240px; height: 236px; border-radius: 14px; background: var(--m-lcd); box-shadow: inset 0 0 0 3px #0a0f1c, inset 0 6px 18px rgba(0, 0, 0, .35); overflow: hidden; }

.rc-screen .readout { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; justify-content: space-between; font: 700 10.5px var(--mono); color: var(--lcd-ink); letter-spacing: .1em; }
.rc-screen .egg { margin-top: 6px; }
.rc-count { display: flex; align-items: baseline; gap: 10px; }
.rc-count .lcd svg { --h: 28px; }
.rc-count small { font: 500 11.5px var(--sans); color: var(--muted); }
.rc-hist { display: grid; gap: 5px; width: 100%; padding: 10px 12px; box-sizing: border-box; border-radius: 8px; background: #05080f; box-shadow: inset 0 0 0 1px var(--line); }
.rc-hist div { display: grid; grid-template-columns: 56px 1fr 44px; align-items: center; gap: 8px; font: 500 11px var(--mono); color: var(--faint); }
.rc-hist div b { color: var(--text-2); font-weight: 600; text-align: right; }
.rc-hist .cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.rc-hist .cells i { height: 8px; border-radius: 1px; background: rgba(140, 178, 255, .1); }
.rc-hist .cells i.f { background: var(--lcd); } .rc-hist .cells i.h { background: linear-gradient(90deg, var(--yellow) 50%, rgba(140, 178, 255, .1) 50%); }

.rc-acts .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rc-acts .rv-btn { min-height: 42px; }
.rc-acts .rv-btn.cy { background: var(--cyan); color: #032029; box-shadow: none; }
.rc-acts .rv-btn.cy:hover { background: #8aefff; }
.rc-acts .rv-btn[disabled] { opacity: .45; cursor: not-allowed; }
.rc-acts .lbl { font: 600 11.5px var(--sans); color: var(--muted); text-align: center; }

.rc-hatch { background: transparent; color: var(--orange-2); box-shadow: inset 0 0 0 1px rgba(255, 138, 36, .55); }
.rc-hatch:hover { background: rgba(255, 138, 36, .1); }
.rc-born { align-self: end; display: grid; gap: 4px; width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--violet) 10%, #0b1122); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--violet) 45%, transparent); }

.rv-sheet-in.wide { width: min(620px, 100%); }
.rc-draft small { display: block; margin: 6px 0 2px; font: 600 11px var(--sans); color: var(--muted); }
@media (max-width: 760px) {

  .rc-port { display: none; }
  .rc-col { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; gap: 8px; }
  .rc-slot { min-height: 150px; padding: 10px; }
  .rc-slot::after { display: none; }
  .rc-screen { width: 220px; height: 220px; }

<script>
(() => {
  const { R, pack, lcd, lcds, copy, fly, partner, toast, switcher, reduced, pad2, esc, $, $$ } = RV;
  const CREST = $(".brand .mark svg")?.outerHTML || "";
  // 一份 Skill 的八格：text = 会写进 Skill 的原文；known / miss = 半格的已知与缺口；need = 填上它要回答的未知
  const SLOTS = {
    r2: [
      { id: "use", name: "用途", st: "full", text: "看懂并复刻「Agent迁移和上下文接力功能」", src: "你写的 · 想弄懂" },
      { id: "shape", name: "结构", st: "full", text: "分两支：Agent 迁移（<code>/agents/migration</code>、<code>/migration/:taskId</code>）与工作交接（<code>/agents/work-handoff</code>）", src: "观察 #3 · 推断 #6" },
      { id: "data", name: "数据", st: "half", known: "产物：migration-packages、context-packs、snapshots", miss: "包的格式、字段和接口协议", src: "观察 #4", need: ["u4", "u2"] },
      { id: "flow", name: "流程", st: "empty", need: ["u6", "u5"] },
      { id: "ui", name: "界面", st: "empty", need: ["u1"] },
      { id: "edge", name: "边界", st: "empty", need: ["u3"] },
      { id: "write", name: "写入与回滚", st: "empty", need: ["u7"] },
      { id: "check", name: "验收", st: "empty", need: ["u9"] },
    ],
  };
  const blank = (r) => [{ id: "use", name: "用途", st: "full", text: esc(r.want), src: "你写的 · 想弄懂" },
    ...["结构", "数据", "流程", "界面", "边界", "写入与回滚", "验收"].map((name, i) => ({ id: "s" + i, name, st: "empty", need: [] }))];
  let cur = "r2", skills = 0;
  const born = {}, ask = {}, sent = {};
  const rec = () => R.find((r) => r.id === cur);
  const slots = () => SLOTS[cur] || (SLOTS[cur] = blank(rec()));
  const askSet = () => ask[cur] || (ask[cur] = new Set(slots().filter((s) => s.st !== "full").map((s) => s.id)));
  const sentSet = () => sent[cur] || (sent[cur] = new Set());
  const nFull = () => slots().filter((s) => s.st === "full").length, nHalf = () => slots().filter((s) => s.st === "half").length;

  // ---- 像素蛋：22×26；第 i 格填上，就在它那一侧的对应高度裂一道 ----
  const W = 22, H = 26, CELL = 8;
  const inside = (x, y) => { const cy = 15, ry = 11.5, t = (y - cy) / ry; if (Math.abs(t) > 1) return false; const rx = 9.6 * (y < cy ? 0.78 + 0.22 * (1 - Math.abs(t)) : 1) * Math.sqrt(1 - t * t); return Math.abs(x + 0.5 - 11) <= rx; };
  const SPOTS = [[8, 9], [9, 9], [8, 10], [14, 14], [15, 14], [14, 15], [6, 19], [7, 19], [12, 22], [13, 22], [16, 20]];
  const BANDS = [8, 12, 17, 22];
  function crackFor(i, part) {
    const left = i < 4, y0 = BANDS[i % 4];
    let x0 = left ? 0 : W - 1; while (!inside(x0, y0)) x0 += left ? 1 : -1;
    const d = left ? 1 : -1, path = [[x0, y0], [x0 + d, y0], [x0 + 2 * d, y0 - 1], [x0 + 3 * d, y0 - 1], [x0 + 4 * d, y0], [x0 + 5 * d, y0 + 1], [x0 + 6 * d, y0 + 1]];
    return path.slice(0, Math.ceil(path.length * part));
  }
  const ZIG = (x) => 11 + (x % 4 < 2 ? 0 : 1);
  function egg(state, hatched, lift = 0) {
    const crack = new Set();
    state.forEach((st, i) => { if (st) for (const [x, y] of crackFor(i, st === "full" ? 1 : 0.5)) crack.add(`${x},${y}`); });
    let s = "";
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!inside(x, y)) continue;
      const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
      const top = hatched && y < ZIG(x), dy = top ? -lift : 0, dx = top ? -Math.round(lift / 2) : 0;
      const seam = hatched && lift > 0 && (y === ZIG(x) || y === ZIG(x) - 1);
      const fill = edge || seam || (!hatched && crack.has(`${x},${y}`)) ? "var(--px-ink)" : SPOTS.some(([a, b]) => a === x && b === y) ? "var(--px-egg-spot)" : "var(--px-egg)";
      s += `<rect x="${(x + dx) * CELL}" y="${(y + dy + 3) * CELL}" width="${CELL}" height="${CELL}" fill="${fill}"/>`;
    }
    if (hatched && lift > 2) for (const [x, y] of [[3, 5], [19, 6], [2, 13], [20, 12]]) s += `<rect x="${x * CELL}" y="${y * CELL}" width="${CELL}" height="${CELL}" fill="var(--lcd-ink)"/>`;
    return `<svg class="egg" viewBox="0 0 ${W * CELL} ${(H + 3) * CELL}" width="${W * CELL * 0.8}" height="${(H + 3) * CELL * 0.8}" shape-rendering="crispEdges" aria-hidden="true">${s}</svg>`;
  }
  const eggState = () => slots().map((s) => (s.st === "empty" ? "" : s.st));

  function slotHtml(s, i) {
    const r = rec(), a = askSet().has(s.id), sn = sentSet().has(s.id);
    const cls = [s.st, sn ? "sent" : a ? "ask" : ""].join(" ");
    const stt = s.st === "full" ? "填上了" : sn ? `第 ${r.rounds.length + 1} 轮在问` : s.st === "half" ? "半格" : "空";
    const qs = (s.need || []).map((id) => r.unknown.find((u) => u.id === id)).filter(Boolean);
    const body = s.st === "full" ? `<span class="lb">写进 Skill</span><p>${s.text}</p>`
      : s.st === "half" ? `<p class="kn">${esc(s.known)}</p><p class="ms">缺 ${esc(s.miss)}</p>`
      : `<p>${qs.length ? esc(qs.map((u) => u.q).join(" ")) : "还没有任何结论，先做一次完整取证。"}</p>`;
    const ft = (s.src ? `<span class="src">${esc(s.src)}</span>` : `<span class="src">${qs.length ? `${qs.length} 个问题` : ""}</span>`) +
      (s.st !== "full" && !sn ? `<button class="rc-tg" data-rc-ask="${s.id}" aria-pressed="${a}"><i>✓</i>放进追问</button>` : "");
    return `<article class="rc-slot ${cls}" data-slot="${s.id}"><div class="rc-sh"><span class="no">${pad2(i + 1)}</span><b>${esc(s.name)}</b><span class="rc-st">${stt}</span></div><div class="rc-body">${body}</div><div class="rc-ft">${ft}</div></article>`;
  }
  function devHtml() {
    const r = rec(), ss = slots(), fl = nFull(), hf = nHalf(), b = born[cur], n = r.rounds.length + 1;
    const asks = ss.filter((s) => askSet().has(s.id) && !sentSet().has(s.id));
    const ports = ss.map((s, i) => { const top = 150 / 2 + (i % 4) * (150 + 10); return `<i class="rc-port ${i < 4 ? "l" : "r"} ${sentSet().has(s.id) ? "sent" : s.st}" style="top:${top}px" aria-hidden="true"></i>`; }).join("");
    const r1 = r.id === "r2" ? `<div><span>第 1 轮</span><span class="cells">${"<i></i>".repeat(8)}</span><b>0 格</b></div>` : "";
    const hist = r.rounds.length ? `<div class="rc-hist">${r1}<div><span>第 ${r.rounds.length} 轮</span><span class="cells">${ss.map((s) => `<i class="${s.st === "full" ? "f" : s.st === "half" ? "h" : ""}"></i>`).join("")}</span><b>${fl}${hf ? "½" : ""} 格</b></div></div>` : `<div class="rc-hist"><div><span>还没交出</span><span class="cells">${"<i></i>".repeat(8)}</span><b>—</b></div></div>`;
    return `<div class="rc-dev">${ports}<div class="top"><span class="crest">${CREST}</span><span class="eyebrow"><b>SKILL</b> 孵化器</span><span class="eyebrow">${b ? "HATCHED" : "INCUBATING"}</span></div>` +
      `<div class="rc-screen" data-rc-screen><div class="readout"><span>${b ? "已孵化" : "孵化中"}</span><span>${fl}${hf ? "½" : ""} / 8</span></div>${egg(eggState(), !!b, b ? 4 : 0)}</div>` +
      `<div class="rc-count"><span class="lcd" data-lcd="${pad2(fl)}"></span><small>格填上${hf ? ` · ${hf} 格半` : ""} · ${8 - fl - hf} 格空</small></div>${hist}` +
      (b ? `<div class="rc-born"><span class="rv-chip">SKILL</span><b>${esc(b)}</b><small>固定版本 v1 · 空着的 ${8 - fl - hf} 格写在「局限」· 未经复刻验证</small><a href="#">在资产仓库打开 →</a></div>`
        : `<div class="rc-acts"><span class="lbl">${asks.length ? `把勾上的 <b>${asks.length} 格</b>写成第 ${n} 轮追问包` : "勾上要问的格子"}</span><div class="row"><button class="rv-btn cy" data-rc-copy="Codex"${asks.length || !r.unknown.length ? "" : " disabled"}>复制给 Codex</button><button class="rv-btn" data-rc-copy="Claude Code"${asks.length || !r.unknown.length ? "" : " disabled"}>复制给 Claude Code</button></div>` +
          `<button class="rv-btn rc-hatch" data-rc-hatch>现在就孵化（存成 Skill）</button></div>`) + `</div>`;
  }
  const questions = () => { const r = rec(), ids = slots().filter((s) => askSet().has(s.id) && !sentSet().has(s.id)).flatMap((s) => s.need || []); return r.unknown.filter((u) => ids.includes(u.id)).map((u) => u.q); };
  function draw() {
    const r = rec(), ss = slots(), last = r.rounds.at(-1);
    $("[data-rc-src]").innerHTML = `<span class="rv-kind">${r.kind === "web" ? "网站" : "本机文件"}</span><h2>${esc(r.nick)}</h2><code>${esc(r.src)}</code><span class="sep">|</span>` +
      `<span>${last ? `第 ${last.n} 轮 · ${last.at} · ${esc(last.by)} · <b>${esc(last.statusText)}</b>` : "还没交出过"}</span><span class="grow"></span><button data-why>＋ 好在哪里（选填）</button>`;
    $("[data-rc-stage]").innerHTML = `<div class="rc-col l">${ss.slice(0, 4).map(slotHtml).join("")}</div>${devHtml()}<div class="rc-col r">${ss.slice(4).map((s, i) => slotHtml(s, i + 4)).join("")}</div>`;
    $("[data-rc-pv]").textContent = pack(r, questions());
    lcds($("[data-rc-stage]"));
  }
  function skillDraft(name) {
    const ss = slots(), plain = (h) => h.replace(/<[^>]+>/g, "");
    return [`# ${name}`, "", `来源：逆向工程 · ${rec().nick}（${rec().src}）· 第 ${rec().rounds.length} 轮结论 · 未经复刻验证`, "",
      ...ss.filter((s) => s.st === "full").map((s) => `## ${s.name}\n${plain(s.text)}`), "",
      ...ss.filter((s) => s.st === "half").map((s) => `## ${s.name}（只知道一半）\n已知：${s.known}\n缺：${s.miss}`), "",
      "## 局限（还没弄清楚）", ...ss.filter((s) => s.st === "empty").map((s) => `- ${s.name}`)].join("\n");
  }
  async function hatch(name) {
    $("[data-rv-sheet]").hidden = true;
    if (!reduced) {
      const st = eggState().map(() => "full");
      for (const k of [0, 1, 2]) { $("[data-rc-screen] .egg").outerHTML = egg(k < 2 ? eggState().map((x, i) => (i < (k + 1) * 4 ? "full" : x)) : st, false); await new Promise((ok) => setTimeout(ok, 120)); }
      for (const l of [1, 2, 3, 4]) { $("[data-rc-screen] .egg").outerHTML = egg(st, true, l); await new Promise((ok) => setTimeout(ok, 90)); }
    }
    born[cur] = name; skills++; draw();
    await fly($("[data-rc-screen]"), partner(), "#a891ff"); dispatchEvent(new Event("guiji:data-caught"));
    lcd($("[data-rc-skills]"), pad2(skills), true);
    toast(`孵出来了：Skill「${name}」。样稿，不写数据。`);
  }

  document.addEventListener("click", async (e) => {
    const t = e.target;
    const a = t.closest("[data-rc-ask]");
    if (a) { const s = askSet(), id = a.dataset.rcAsk; s.has(id) ? s.delete(id) : s.add(id); draw(); return; }
    if (t.closest("[data-why]")) { toast("样稿：这里可以补一句「我觉得它好在哪」，选填。"); return; }
    const cp = t.closest("[data-rc-copy]");
    if (cp && !cp.disabled) {
      const qs = questions();
      await copy(cp, pack(rec(), qs), cp.dataset.rcCopy);
      for (const s of slots()) if (askSet().has(s.id)) sentSet().add(s.id);
      askSet().clear(); draw();
      toast(`第 ${rec().rounds.length + 1} 轮追问包已复制（${qs.length ? qs.length + " 个问题" : "完整取证"}）。对应的格子和接口灯标成「在问」。`);
      return;
    }
    if (t.closest("[data-rc-hatch]")) {
      const fl = nFull(), hf = nHalf(), emp = 8 - fl - hf, name = "Agent 迁移与工作交接 · 拆解";
      const sh = $("[data-rv-sheet]");
      sh.innerHTML = `<div class="rv-sheet-in wide" role="dialog" aria-label="孵化预览"><header><h3>孵化 · 预览</h3><button class="ibtn" data-x aria-label="关闭">×</button></header>` +
        `<label>名字<input value="${name}" data-rc-name></label>` +
        `<dl><dt>已填</dt><dd>${fl} 格${hf ? ` + ${hf} 格半` : ""}</dd><dt>局限</dt><dd>空着的 ${emp} 格写进「局限」</dd><dt>版本</dt><dd>固定版本 v1 · 写入后回读核对</dd><dt>验证</dt><dd class="warn">未经复刻验证</dd></dl>` +
        `<div class="rc-draft"><small>会存进资产仓库的 Skill 原文</small><pre data-rc-draft>${esc(skillDraft(name))}</pre></div>` +
        `<div class="rv-acts"><button class="rv-btn pri" data-rc-confirm>确认孵化</button><button class="rv-btn ghost" data-x>先不孵，继续问</button></div></div>`;
      sh.hidden = false; return;
    }
    if (t.closest("[data-rc-confirm]")) return hatch($("[data-rc-name]").value || "未命名 Skill");
    if (t.closest("[data-x]") || t.matches("[data-rv-sheet]")) $("[data-rv-sheet]").hidden = true;
  });
  document.addEventListener("input", (e) => { if (e.target.matches("[data-rc-name]")) $("[data-rc-draft]").textContent = skillDraft(e.target.value || "未命名 Skill"); });
  switcher(() => cur, (id) => { cur = id; draw(); });
  lcds(document, true);
  draw();
})();
</script>
</body>
</html>
