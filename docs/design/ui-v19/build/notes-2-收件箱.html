<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>随手记 · 二 · 收件箱</title>
<!-- 模板：由 build/make.py 填入侧栏（含伙伴屏）、真实便签后生成 ../随手记-2-收件箱.html -->
<link rel="stylesheet" href="../ui-v18/common.css"><link rel="stylesheet" href="../../../src/partner-lcd.css"><link rel="stylesheet" href="../../../src/scan-motion.css"><link rel="stylesheet" href="v19.css">
</head>
<body class="v19 n2">
<!--ASIDE-->
<main>
<div class="top"><span class="crumb">数码世界 / <b>随手记</b></span><span class="search">搜索工作台<kbd>⌘K</kbd></span></div>
<div class="bar">
  <h1>随手记<span class="en">QUICK NOTES</span></h1>
  <div class="counts">
    <span class="cnt"><span class="lcd" data-lcd data-roll="<!--N-EGG-->" data-notes-count></span><small>待孵化</small></span>
    <span class="cnt"><span class="lcd" data-lcd data-roll="<!--N-DELIVERED-->" data-count="delivered"></span><small>已投递</small></span>
    <span class="cnt"><span class="lcd" data-lcd data-text="00" data-count="archived"></span><small>已归档</small></span>
  </div>
  <form class="cmd" data-cmd data-compose><span>&gt;</span><input placeholder="记一笔：一个念头、一个问题……" aria-label="记一笔"><kbd>⌘↵</kbd><button type="submit">记下</button></form>
</div>
<div class="panes">
  <section class="list" aria-label="便签列表">
    <div class="seg" role="radiogroup" aria-label="筛选"><button class="on" data-filter="all">全部<b data-count="all"><!--N-ALL--></b></button><button data-filter="egg">待孵化<b data-notes-count-plain><!--N-EGG--></b></button><button data-filter="delivered">已投递<b data-count-plain="delivered"><!--N-DELIVERED--></b></button><button data-filter="archived">已归档<b data-count-plain="archived">0</b></button></div>
    <div class="rows" data-note-list data-keep="99">
      <template><div class="row" data-state="egg" tabindex="0"><i class="dot"></i><div><b></b><small>刚刚 · 1 行</small></div><span></span></div></template>
      <!--ROWS-->
    </div>
  </section>
  <section class="pane" data-pane aria-label="便签正文">
    <header>
      <time data-pane-time><!--FIRST-TIME--></time><span class="chip" data-pane-state><!--FIRST-STATE--></span><span class="grow"></span>
      <div class="acts"><button class="act go" data-go="deliver">投递 ▾</button><button class="act" data-go="hatch">孵成资产</button><button class="act" data-go="refine">焚决</button><button class="act" data-go="archive">归档</button><button class="act" data-copy-pane>复制</button></div>
    </header>
    <div class="menu" data-deliver-menu hidden><button data-project="牛马之家">牛马之家 · SLOT 01</button><button data-project="数码世界">数码世界 · SLOT 02</button></div>
    <article class="read" data-pane-body><!--FIRST--></article>
    <footer>来源 随手记 · 普通便签 · <span data-pane-lines><!--FIRST-LINES--></span> 行</footer>
  </section>
</div>
</main>
<script type="application/json" id="notes-data"><!--NOTES-JSON--></script>
<script src="../ui-v18/page.js"></script>
<script src="v19.js" defer></script>
</body>
</html>
