<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逆向工程 · 3A · 透视图精修</title>
<!-- 样稿（2026-10-29 第三轮，2A 精修）：主角仍是参照物本身。这一版的细节：
     ① 按归属分区——Agent 迁移 / 工作交接两区（推断出的分支），底下是关系没建立的接口，整体性的未知在参照物两边；雾点落在它所属的区里。
     ② 真的「照亮」：进场与换轮时一道透视光从左扫到右，扫过的部件按帧亮起；黑着的地方是点阵雾。
     ③ 第 1 轮 / 第 2 轮可切换，看每一轮照亮了什么。④ 检查器写出「它周围还黑着什么」，可一键追问；收成预览会写进 Skill 的内容。
     侧栏与伙伴屏原样取自项目空间 7E；只在界面上变，不写数据。 -->
<link rel="stylesheet" href="../ui-v18/common.css"><link rel="stylesheet" href="../../../src/partner-lcd.css"><link rel="stylesheet" href="v19.css"><link rel="stylesheet" href="v19-reverse.css"><link rel="stylesheet" href="v19-reverse-r2.css">
<style>
.xa-stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.xa-map { position: relative; overflow: hidden; padding: 14px 18px 10px; border-radius: var(--r-2); background:
  radial-gradient(circle at 1px 1px, rgba(140, 178, 255, 0.08) 1px, transparent 1.4px) 0 0 / 18px 18px, var(--m-screen); box-shadow: var(--m-screen-edge), inset 0 0 0 1px var(--line-2); }
.xa-mhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.xa-mhead h2 { margin: 0; font: 800 20px var(--sans); }
.xa-mhead .src { font: 500 12.5px var(--mono); color: var(--muted); }
.xa-rounds { display: flex; gap: 2px; margin-left: auto; padding: 3px; border-radius: 8px; background: #05080f; box-shadow: inset 0 0 0 1px var(--line); }
.xa-rounds button { display: grid; gap: 1px; min-width: 92px; min-height: 40px; padding: 4px 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: inherit; text-align: left; cursor: pointer; }
.xa-rounds button b { font: 700 12px var(--sans); }
.xa-rounds button small { font: 500 10.5px var(--mono); color: var(--faint); }
.xa-rounds button[aria-pressed="true"] { background: var(--panel-3); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-3); }
.xa-rounds button[aria-pressed="true"] small { color: var(--lcd); }
.xa-want { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12.5px; color: var(--faint); }
.xa-want b { color: var(--text-2); font-weight: 600; }
.xa-want button { min-height: 24px; padding: 0 8px; border: 0; border-radius: 4px; background: none; color: var(--muted); font: 500 12px var(--sans); outline: 1px dashed var(--line-3); outline-offset: -1px; cursor: pointer; }
.xa-svgwrap { position: relative; margin-top: 6px; }
.xa-svg { display: block; width: 100%; height: auto; }
.xa-svg text { font-family: var(--mono); }
.xa-svg .zone { fill: rgba(168, 145, 255, 0.045); stroke: rgba(168, 145, 255, 0.35); stroke-dasharray: 6 5; }
.xa-svg .zone.tray { fill: rgba(140, 178, 255, 0.03); stroke: rgba(140, 178, 255, 0.2); }
.xa-svg .zl { fill: var(--violet); font: 700 10px var(--mono); letter-spacing: .14em; }
.xa-svg .zl.tray { fill: var(--faint); }
.xa-svg .zc { fill: var(--faint); font: 500 10.5px var(--sans); }
.xa-svg .edge { fill: none; stroke: color-mix(in srgb, var(--lcd) 55%, transparent); stroke-width: 1.4; }
.xa-svg .edge.p { stroke: color-mix(in srgb, var(--violet) 70%, transparent); stroke-dasharray: 5 4; }
.xa-svg .edge.x { stroke: rgba(140, 178, 255, 0.2); stroke-dasharray: 2 4; }
.xa-svg .node { cursor: pointer; }
.xa-svg .node:focus { outline: none; }
.xa-svg .node:focus-visible rect, .xa-svg .node:focus-visible circle.f { stroke: var(--cyan); stroke-width: 2.4; }
.xa-svg .node rect.b { fill: #0b1a17; stroke: color-mix(in srgb, var(--lcd) 70%, transparent); stroke-width: 1.2; }
.xa-svg .node .k { fill: var(--lcd); font-size: 9px; letter-spacing: .12em; }
.xa-svg .node .n { fill: var(--text); font-size: 12px; }
.xa-svg .node .ev { fill: color-mix(in srgb, var(--lcd) 70%, transparent); font-size: 9px; }
.xa-svg .node.p rect.b { fill: #151231; stroke: var(--violet); stroke-dasharray: 5 3; }
.xa-svg .node.p .k, .xa-svg .node.p .ev { fill: var(--violet); }
.xa-svg .node.p .n { font-family: var(--sans); font-weight: 700; font-size: 13.5px; }
.xa-svg .node.c rect.b { fill: #0f1729; stroke: var(--orange); stroke-width: 1.6; filter: drop-shadow(0 0 10px rgba(255, 138, 36, .35)); }
.xa-svg .node.c .k { fill: var(--orange-2); }
.xa-svg .node.c .n { font-family: var(--sans); font-weight: 800; font-size: 16px; }
.xa-svg .node.o rect.b { filter: drop-shadow(0 0 6px rgba(166, 227, 110, .28)); }
.xa-svg .node:hover rect.b, .xa-svg .node.sel rect.b { stroke-width: 2.2; filter: drop-shadow(0 0 9px rgba(166, 227, 110, .7)); }
.xa-svg .node.p:hover rect.b, .xa-svg .node.p.sel rect.b { filter: drop-shadow(0 0 9px rgba(168, 145, 255, .7)); }
.xa-svg .node.dim { opacity: .28; }
.xa-svg .fog .h { fill: url(#xa-dither); opacity: .9; }
.xa-svg .fog circle.f { fill: #0b1120; stroke: rgba(140, 178, 255, 0.3); stroke-width: 1; }
.xa-svg .fog .q { fill: var(--muted); font: 700 14px var(--sans); }
.xa-svg .fog .l { fill: var(--faint); font: 500 11px var(--sans); }
.xa-svg .fog:hover circle.f, .xa-svg .fog.sel circle.f { stroke: var(--text-2); stroke-width: 1.6; }
.xa-svg .fog.ask circle.f { fill: #2a1606; stroke: var(--orange); stroke-width: 1.8; filter: drop-shadow(0 0 8px rgba(255, 138, 36, .6)); }
.xa-svg .fog.ask .q, .xa-svg .fog.ask .l { fill: var(--orange-2); }
.xa-svg .fog.sent circle.f { stroke: var(--cyan); stroke-dasharray: 3 3; fill: #071d24; }
.xa-svg .fog.sent .q, .xa-svg .fog.sent .l { fill: var(--cyan); }
.xa-svg .fog.big circle.f { stroke-dasharray: 4 4; }
.xa-beam { position: absolute; top: 0; bottom: 0; width: 70px; margin-left: -35px; background: linear-gradient(90deg, transparent, rgba(77, 227, 255, .10) 40%, rgba(77, 227, 255, .22) 50%, rgba(77, 227, 255, .10) 60%, transparent); border-right: 1px solid rgba(77, 227, 255, .5); pointer-events: none; }
.xa-mfoot { display: flex; align-items: center; gap: 10px; min-width: 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
.xa-mfoot .rv2-cells { flex: none; flex-wrap: nowrap; gap: 2px; }
.xa-mfoot .rv2-cells i { width: 7px; height: 10px; }
.xa-mfoot > span:nth-child(2) { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.xa-mfoot b { color: var(--text-2); font-weight: 600; }
.xa-mfoot .delta { flex: none; margin-left: auto; white-space: nowrap; color: var(--lcd); font: 600 11.5px var(--mono); }

.xa-side { display: grid; gap: 12px; }
.xa-card { padding: 14px 16px; border-radius: var(--r-2); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.xa-card h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 700 11.5px var(--mono); letter-spacing: .14em; color: var(--muted); }
.xa-card h3 .grow { flex: 1; }
.xa-lit { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 10px; }
.xa-lit .lcd svg { --h: 34px; }
.xa-lit .of { margin-bottom: 4px; font: 700 14px var(--mono); color: var(--faint); }
.xa-lit small { display: block; font: 500 11px var(--mono); color: var(--muted); }
.xa-lit .d { color: var(--lcd); }
.xa-ins { min-height: 150px; }
.xa-ins .tag { display: inline-flex; align-items: center; gap: 6px; }
.xa-ins .m { padding: 1px 6px; border-radius: 3px; font: 600 10.5px var(--sans); }
.xa-ins .m.o { background: color-mix(in srgb, var(--lcd) 14%, transparent); color: var(--lcd); }
.xa-ins .m.p { background: color-mix(in srgb, var(--violet) 16%, transparent); color: var(--violet); }
.xa-ins .m.u { background: rgba(140, 178, 255, .08); color: var(--muted); }
.xa-ins .where { font: 500 11px var(--mono); color: var(--faint); }
.xa-ins h4 { margin: 8px 0 0; font: 700 15px var(--mono); overflow-wrap: anywhere; }
.xa-ins h4.s { font-family: var(--sans); }
.xa-ins p { margin: 6px 0 0; font-size: 13px; line-height: 1.6; color: var(--text-2); }
.xa-near { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.xa-near small { display: block; margin-bottom: 6px; font: 600 10.5px var(--mono); letter-spacing: .12em; color: var(--faint); }
.xa-near div { display: flex; flex-wrap: wrap; gap: 6px; }
.xa-near button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: #0b1120; color: var(--text-2); font: 500 12px var(--sans); box-shadow: inset 0 0 0 1px var(--line-2); cursor: pointer; }
.xa-near button::before { content: "?"; font-weight: 700; color: var(--muted); }
.xa-near button[aria-pressed="true"] { background: #2a1606; color: var(--orange-2); box-shadow: inset 0 0 0 1px rgba(255, 138, 36, .6); }
.xa-near button[aria-pressed="true"]::before { content: "✓"; color: var(--orange-2); }
.xa-ins .rv-btn { margin-top: 12px; }
.xa-q { display: grid; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; counter-reset: q; }
.xa-q li { display: grid; grid-template-columns: 20px minmax(0, 1fr) 28px; align-items: start; gap: 6px; font-size: 12.5px; line-height: 1.55; color: var(--text-2); counter-increment: q; }
.xa-q li::before { content: counter(q); font: 700 11px/20px var(--mono); color: var(--orange-2); }
.xa-q li button { width: 28px; height: 28px; margin-top: -4px; border: 0; border-radius: 6px; background: none; color: var(--faint); cursor: pointer; }
.xa-q li button:hover { color: var(--text); background: rgba(233, 238, 255, .06); }
.xa-q .none { display: block; color: var(--faint); }
.xa-q .none::before { content: none; }
.xa-card .rv-acts { margin-top: 6px; }
.xa-card .rv-acts .rv-btn { flex: 1; }
.xa-card .rv-btn.cy { background: var(--cyan); color: #032029; box-shadow: none; }
.xa-card .rv-btn.cy:hover { background: #8aefff; }
.xa-pv summary { min-height: 32px; font-size: 12px; color: var(--muted); cursor: pointer; }
.xa-pv pre { max-height: 180px; margin: 4px 0 0; padding: 10px 12px; overflow: auto; border-radius: 6px; background: #05080f; box-shadow: inset 0 0 0 1px var(--line); font: 11.5px/1.65 var(--mono); color: var(--text-2); white-space: pre-wrap; }
.xa-skill { display: grid; gap: 4px; margin: 0 0 12px; padding: 0; list-style: none; font-size: 12.5px; color: var(--text-2); }
.xa-skill li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px; }
.xa-skill li span { color: var(--faint); }
.xa-skill li.lim b { color: var(--yellow); font-weight: 500; }
.xa-card .rv-btn.full { width: 100%; }
.xa-done { display: grid; gap: 4px; padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--violet) 8%, #0b1122); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--violet) 40%, transparent); }
.xa-done b { font: 700 14px var(--sans); }
.xa-done small { color: var(--muted); }
.xa-blank { display: grid; place-items: center; min-height: 400px; text-align: center; color: var(--muted); font-size: 13px; }
.xa-blank b { display: block; margin: 14px 0 4px; font: 700 16px var(--sans); color: var(--text-2); }
@media (max-width: 760px) {
  .xa-stage { grid-template-columns: minmax(0, 1fr); }
  .xa-map { margin: 0 -16px; border-radius: 0; padding: 12px 12px 10px; }
  .xa-rounds { margin-left: 0; width: 100%; }
  .xa-rounds button { flex: 1; }
  .xa-svgwrap { margin: 6px -12px 0; overflow-x: auto; scrollbar-width: none; }
  .xa-svgwrap::-webkit-scrollbar { display: none; }
  .xa-svg { width: 720px; max-width: none; }
  .xa-mfoot { flex-wrap: wrap; }
}
</style>

<!--ASIDE-->
<main>
<!--TOP-->
<div class="bar">
  <h1>逆向工程<span class="en">REVERSE ENGINEERING</span></h1>
  <div class="counts">
    <span class="cnt"><span class="lcd" data-lcd="03"></span><small>标本</small></span>
    <span class="cnt"><span class="lcd violet" data-lcd="00" data-xa-skills></span><small>已收成</small></span>
  </div>
</div>
<nav class="rv2-switch" data-rv-switch aria-label="选择标本"></nav>

  <section class="xa-map" data-xa-map aria-label="透视图"></section>
  <aside class="xa-side" data-xa-side></aside>
</div>
<p class="rv-draft"><span class="tag">样稿</span>10-29 正式库只读摘录：两轮都是 Codex 的真实结论（10/15、10/16）。点部件看证据和周围还黑着的，点雾点加进追问；只在界面上变。</p>

<script src="../ui-v18/page.js"></script>
<script src="v19-reverse-r2.js"></script>
<script>
(() => {
  const { R, pack, lcd, lcds, copy, fly, partner, toast, switcher, reduced, STEP, pad2, esc, $, $$ } = RV;
  let cur = "r2", round = 2, sel = "k-api-mp", skills = 0;
  const ask = new Set(["u1", "u4", "u5"]), sent = new Set();
  const rec = () => R.find((r) => r.id === cur);

  // 区：迁移、交接（推断出的两支）、底下的托盘（关系没建立的接口），顶上一行是整体性的未知
  const ZONES = [
    { id: "m", x: 14, y: 92, w: 352, h: 284, label: "AGENT 迁移", note: "推断的分支" },
    { id: "h", x: 394, y: 92, w: 352, h: 284, label: "工作交接", note: "推断的分支" },
    { id: "t", x: 14, y: 390, w: 732, h: 76, label: "关系没建立", note: "看到了，但不知道属于哪一支", tray: true },
  ];
  const POS = {
    c: [380, 44, 230, 58],
    "k-br-m": [190, 124, 140, 38], "k-br-h": [570, 124, 140, 38],
    "k-route-m": [104, 196, 168, 38], "k-route-t": [276, 196, 160, 38], "k-route-h": [570, 196, 196, 38],
    "k-api-mp": [104, 268, 168, 38], "k-api-cp": [490, 268, 148, 38],
    "k-api-sn": [250, 436, 132, 36], "k-api-cf": [400, 436, 146, 36], "k-api-sd": [566, 436, 166, 36],
  };
  const SHORT = { "k-route-t": "/migration/:taskId" };
  const EDGES = [["c", "k-br-m", "p"], ["c", "k-br-h", "p"], ["k-br-m", "k-route-m"], ["k-br-m", "k-route-t"], ["k-route-m", "k-api-mp"], ["k-br-h", "k-route-h"], ["k-route-h", "k-api-cp"]];
  // 雾点落在它所属的区
  const FOG = { u1: [276, 268, "m"], u6: [276, 330, "m"], u3: [56, 330, "m"], u4: [168, 330, "m"], u5: [680, 268, "h"], u2: [702, 432, "t"], u7: [76, 432, "t"], u8: [132, 44, "c"], u9: [628, 44, "c"] };
  const ZONE_OF = { "k-br-m": "m", "k-route-m": "m", "k-route-t": "m", "k-api-mp": "m", "k-br-h": "h", "k-route-h": "h", "k-api-cp": "h", "k-api-sn": "t", "k-api-cf": "t", "k-api-sd": "t", c: "c" };
  const ZNAME = { m: "Agent 迁移区", h: "工作交接区", t: "没归属的接口", c: "整体" };
  // 第 1 轮：只知道页面叫「炉子」，四个大雾团
  const R1FOG = [[380, 160, "/community 有没有打开"], [190, 270, "迁移的对象、入口"], [570, 270, "接力包含哪些信息"], [380, 410, "模块、接口、数据"]];

  const box = (id, cls, kind, name, ev) => {
    const [x, y, w, h] = POS[id];
    return `<g class="node ${cls}${sel === id ? " sel" : ""}" data-node="${id}" data-x="${x}" tabindex="0" role="button" aria-label="${esc(name)}">` +
      `<rect class="b" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${cls.startsWith("c") ? 9 : 6}"/>` +
      `<text class="k" x="${x - w / 2 + 10}" y="${y - h / 2 + 13}">${esc(kind)}</text>` + (ev ? `<text class="ev" x="${x + w / 2 - 8}" y="${y - h / 2 + 13}" text-anchor="end">#${ev}</text>` : "") +
      `<text class="n" x="${x}" y="${y + h / 2 - (cls.startsWith("c") ? 13 : 9)}" text-anchor="middle">${esc(name)}</text></g>`;
  };
  const mid = (a) => POS[a].slice(0, 2);
  const edge = ([a, b, cls = ""]) => { const [x1, y1] = mid(a), [x2, y2] = mid(b), my = (y1 + y2) / 2; return `<path class="edge ${cls}" d="M${x1} ${y1 + (a === "c" ? 29 : 19)} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2 - 19}"/>`; };
  const fogEl = (id, x, y, label, big) => {
    const c = ask.has(id) ? " ask" : sent.has(id) ? " sent" : "";
    return `<g class="node fog${c}${big ? " big" : ""}${sel === id ? " sel" : ""}" data-fog="${id}" data-x="${x}" tabindex="0" role="button" aria-pressed="${ask.has(id)}" aria-label="未知：${esc(label)}">` +
      `<circle class="h" cx="${x}" cy="${y}" r="${big ? 64 : 30}"/><circle class="f" cx="${x}" cy="${y}" r="${big ? 26 : 15}"/><text class="q" x="${x}" y="${y + 5}" text-anchor="middle">${sent.has(id) ? "…" : "?"}</text>` +
      `<text class="l" x="${x}" y="${y + (big ? 44 : 30)}" text-anchor="middle">${esc(label)}</text></g>`;
  };
  const DEFS = `<defs><pattern id="xa-dither" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#26324f"/><rect x="2" y="2" width="2" height="2" fill="#1c2640"/></pattern>` +
    `<radialGradient id="xa-fade"><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="xa-m"><rect width="760" height="470" fill="url(#xa-fade)"/></mask></defs>`;

  function svgRound2(r) {
    let s = `<svg class="xa-svg" viewBox="0 0 760 472" role="group" aria-label="${esc(r.nick)} 的透视图 · 第 2 轮">${DEFS}`;
    for (const z of ZONES) s += `<rect class="zone${z.tray ? " tray" : ""}" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="12"/>` +
      `<text class="zl${z.tray ? " tray" : ""}" x="${z.x + 12}" y="${z.y + 18}">${z.label}</text><text class="zc" x="${z.x + z.w - 12}" y="${z.y + 18}" text-anchor="end">${z.note}</text>`;
    s += `<path class="edge x" d="M380 73 L380 390"/>` + EDGES.map(edge).join("");
    for (const u of r.unknown) { const [x, y] = FOG[u.id]; s += fogEl(u.id, x, y, u.short); }
    s += box("c", "c", "参照物 · 炉子", "app.luzi.top/agents");
    for (const k of r.known) s += box(k.id, k.mark === "推断" ? "p" : "o", k.kind === "分支" ? "推断 · 功能分支" : k.kind, SHORT[k.id] || k.name, k.ev);
    return s + `</svg>`;
  }
  function svgRound1() {
    let s = `<svg class="xa-svg" viewBox="0 0 760 472" role="group" aria-label="炉子的透视图 · 第 1 轮">${DEFS}`;
    R1FOG.forEach(([x, y, l], i) => (s += `<path class="edge x" d="M380 73 L${x} ${y - 26}"/>`));
    R1FOG.forEach(([x, y, l], i) => (s += fogEl("r1-" + i, x, y, l, true)));
    return s + box("c", "c", "参照物 · 炉子", "app.luzi.top/agents") + `</svg>`;
  }

  function sweep(wrap) {
    if (reduced || !wrap) return;
    const beam = document.createElement("i"); beam.className = "xa-beam"; wrap.appendChild(beam);
    const nodes = $$(".node:not(.fog)", wrap), W = wrap.getBoundingClientRect().width;
    for (const g of nodes) g.style.opacity = "0.12";
    const N = 14;
    beam.animate([...Array(N + 1)].map((_, k) => ({ offset: k / N, left: `${(k / N) * 100}%`, opacity: k === N ? 0 : 1, ...STEP })), { duration: 700 }).onfinish = () => beam.remove();
    for (const g of nodes) { const x = Number(g.dataset.x) / 760; setTimeout(() => { g.style.opacity = ""; g.animate([{ opacity: .4, ...STEP }, { offset: .5, opacity: 1, ...STEP }, { opacity: 1 }], { duration: 120 }); }, Math.round(x * 700)); }
  }

  function drawMap(lightUp) {
    const r = rec(), m = $("[data-xa-map]"), rs = r.rounds;
    const seg = rs.length ? `<div class="xa-rounds" role="group" aria-label="看第几轮">${rs.map((x) => `<button data-round="${x.n}" aria-pressed="${x.n === round}"><b>第 ${x.n} 轮 · ${x.at}</b><small>${x.status === "部分" ? `亮 ${r.known.length} 处` : x.status === "阻断" ? "被挡 · 亮 0 处" : "失败"}</small></button>`).join("")}</div>` : "";
    const head = `<div class="xa-mhead"><span class="rv-kind">${r.kind === "web" ? "网站" : "本机文件"}</span><h2>${esc(r.nick)}</h2><span class="src">${esc(r.src)}</span>${seg}</div>` +
      `<div class="xa-want"><span>想弄懂 <b>${esc(r.want)}</b></span><span>好在哪里 <button data-why>＋ 写一句（选填）</button></span></div>`;
    if (!r.known.length) {
      const last = rs.at(-1);
      m.innerHTML = head + `<div class="xa-blank"><div><svg width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">${DEFS}<circle cx="70" cy="70" r="66" fill="url(#xa-dither)" opacity=".9"/><circle cx="70" cy="70" r="30" fill="#0b1120" stroke="rgba(140,178,255,.3)" stroke-dasharray="4 4"/><text x="70" y="78" text-anchor="middle" fill="#8b98b8" font-size="24" font-weight="700">?</text></svg>` +
        `<b>整件还黑着</b>${last ? esc(`${last.at} ${last.statusText}`) : "还没交出过"}</div></div>`;
      return;
    }
    const x = rs.find((y) => y.n === round), lit = round === 2 ? r.known.length : 0, dark = round === 2 ? r.unknown.length : 4;
    const cells = `<span class="rv2-cells" aria-hidden="true">${"<i class=o></i>".repeat(round === 2 ? 8 : 0)}${"<i class=p></i>".repeat(round === 2 ? 2 : 0)}${"<i class=u></i>".repeat(dark)}</span>`;
    m.innerHTML = head + `<div class="xa-svgwrap" data-wrap>${round === 2 ? svgRound2(r) : svgRound1()}</div>` +
      `<div class="xa-mfoot">${cells}<span>第 ${x.n} 轮 · ${esc(x.by)} · ${esc(x.statusText)}</span>${round === 2 ? `<span class="delta">比第 1 轮 +${lit} 处</span>` : ""}</div>`;
    if (lightUp) sweep($("[data-wrap]", m));
  }

  function inspector(r) {
    if (round === 1 && r.known.length) return `<section class="xa-card xa-ins"><h3>第 1 轮 · 10/15</h3><div class="tag"><span class="m u">被挡</span></div><h4 class="s">只知道页面叫「炉子」</h4><p>调试窗口里没有 /community 页，取证停在目标匹配；留下 4 个大雾团。第 2 轮改投 /agents、加了 8 个线索词。</p></section>`;
    const k = r.known.find((x) => x.id === sel), f = r.unknown.find((x) => x.id === sel);
    if (!k && !f) return `<section class="xa-card xa-ins"><h3>检查器</h3><p style="color:var(--faint)">点一个亮着的部件看证据；点一个雾点看它要问什么。</p></section>`;
    const zone = k ? ZONE_OF[k.id] : FOG[f.id][2];
    const near = r.unknown.filter((u) => FOG[u.id][2] === zone && u.id !== sel);
    const nearHtml = near.length ? `<div class="xa-near"><small>这一区还黑着 ${near.length} 处</small><div>${near.map((u) => `<button data-toggle="${u.id}" aria-pressed="${ask.has(u.id)}">${esc(u.short)}</button>`).join("")}</div></div>` : "";
    if (k) return `<section class="xa-card xa-ins" aria-live="polite"><h3>检查器 <span class="grow"></span><span class="where">${ZNAME[zone]}</span></h3><div class="tag"><span class="m ${k.mark === "推断" ? "p" : "o"}">${k.mark}</span><span class="where">${k.kind} · 第 2 轮结论 #${k.ev}</span></div><h4${k.kind === "分支" ? ' class="s"' : ""}>${esc(k.name)}</h4><p>${esc(k.text)}</p>${nearHtml}</section>`;
    return `<section class="xa-card xa-ins" aria-live="polite"><h3>检查器 <span class="grow"></span><span class="where">${ZNAME[zone]}</span></h3><div class="tag"><span class="m u">未知</span><span class="where">第 2 轮留下的</span></div><h4 class="s">${esc(f.short)}</h4><p>${esc(f.q)}</p>` +
      `<button class="rv-btn ${ask.has(f.id) ? "" : "pri"}" data-toggle="${f.id}">${ask.has(f.id) ? "✓ 已放进第 3 轮 · 点了移出" : sent.has(f.id) ? "已在问 · 再问一次" : "放进第 3 轮追问"}</button>${nearHtml}</section>`;
  }

  function drawSide() {
    const r = rec(), side = $("[data-xa-side]");
    const o = r.known.filter((k) => k.mark === "观察").length, p = r.known.filter((k) => k.mark === "推断").length, u = r.unknown.length, total = o + p + u;
    const qs = r.unknown.filter((x) => ask.has(x.id)), n = r.rounds.length + 1;
    side.innerHTML =
      `<section class="xa-card"><h3>照亮了多少</h3>` + (total ? `<div class="xa-lit"><span class="lcd" data-lcd="${pad2(o + p)}"></span><span class="of">/ ${pad2(total)}</span>` +
        `<span><small>看到 ${o} · 推断 ${p} · 未知 ${u}</small><small class="d">第 1 轮 0 / 4 → 第 2 轮 ${o + p} / ${total}</small></span></div><div class="rv2-cells" aria-hidden="true">${"<i class=o></i>".repeat(o)}${"<i class=p></i>".repeat(p)}${r.unknown.map((x) => `<i class="${ask.has(x.id) ? "q" : "u"}"></i>`).join("")}</div>`
        : `<div class="xa-lit"><span class="lcd dim" data-lcd="00"></span><span><small>还没有回来过结论</small></span></div>`) + `</section>` +
      inspector(r) +
      `<section class="xa-card"><h3>第 ${n} 轮要问 <span class="grow"></span><span class="lcd orange" data-lcd="${pad2(qs.length)}"></span></h3>` +
        (r.unknown.length ? `<ol class="xa-q">${qs.map((x) => `<li>${esc(x.q)}<button data-toggle="${x.id}" aria-label="不问这条">×</button></li>`).join("") || `<li class="none">从左边点雾点，加进来。</li>`}</ol>`
          : `<ol class="xa-q"><li class="none">${r.rounds.length ? "上一轮没拿到结论，这一轮再做一次完整取证。" : "第一轮：做一次完整取证。"}</li></ol>`) +
        `<div class="rv-acts"><button class="rv-btn cy" data-xa-copy="Codex">复制给 Codex</button><button class="rv-btn" data-xa-copy="Claude Code">复制给 Claude Code</button></div>` +
        `<details class="xa-pv"><summary>看追问包全文</summary><pre>${esc(pack(r, qs.map((x) => x.q)))}</pre></details></section>` +
      `<section class="xa-card"><h3>收成</h3>` + (skills ? `<div class="xa-done"><span class="rv-chip">SKILL</span><b>Agent 迁移与工作交接 · 拆解</b><small>固定版本 v1 · ${u} 处还黑着，写在「局限」里</small></div>`
        : r.known.length ? `<ul class="xa-skill"><li><span>结构</span>两支：Agent 迁移 / 工作交接</li><li><span>入口</span>3 个路由</li><li><span>接口</span>5 个候选（2 个归了支，3 个没归属）</li><li class="lim"><span>局限</span><b>${u} 处还黑着 · 未经复刻验证</b></li></ul><button class="rv-btn pri full" data-xa-save>把照亮的部分存成 Skill</button>`
        : `<p style="margin:0;font-size:12.5px;color:var(--muted)">还没有照亮的部件，先交出去。</p>`) + `</section>`;
    lcds(side);
  }
  const draw = (light) => { drawMap(light); drawSide(); };

  document.addEventListener("click", async (e) => {
    const t = e.target;
    const rb = t.closest("[data-round]");
    if (rb) { round = Number(rb.dataset.round); draw(true); return; }
    const fog = t.closest("[data-fog]");
    if (fog) { const id = fog.dataset.fog; if (id.startsWith("r1-")) return; sel === id ? (ask.has(id) ? ask.delete(id) : ask.add(id), sent.delete(id)) : (sel = id); draw(); return; }
    const nd = t.closest("[data-node]");
    if (nd) { sel = nd.dataset.node === "c" ? null : nd.dataset.node; draw(); return; }
    const tg = t.closest("[data-toggle]");
    if (tg) { const id = tg.dataset.toggle; sent.delete(id); ask.has(id) ? ask.delete(id) : ask.add(id); draw(); return; }
    if (t.closest("[data-why]")) { toast("样稿：这里可以补一句「我觉得它好在哪」，选填。"); return; }
    const cp = t.closest("[data-xa-copy]");
    if (cp) {
      const r = rec(), qs = r.unknown.filter((x) => ask.has(x.id));
      await copy(cp, pack(r, qs.map((x) => x.q)), cp.dataset.xaCopy);
      for (const x of qs) { ask.delete(x.id); sent.add(x.id); }
      draw(); toast(`第 ${r.rounds.length + 1} 轮追问包已复制（${qs.length} 个问题），这几个雾点标成「在问」。`);
      return;
    }
    const sv = t.closest("[data-xa-save]");
    if (sv) {
      await fly(sv, partner(), "#a891ff"); dispatchEvent(new Event("guiji:data-caught"));
      skills = 1; lcd($("[data-xa-skills]"), "01", true); drawSide(); toast("已存成 Skill（样稿，不写数据）。");
    }
  });
  document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".xa-svg .node")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
  switcher(() => cur, (id) => { cur = id; round = rec().rounds.length || 1; sel = id === "r2" ? "k-api-mp" : null; draw(true); });
  lcds(document, true);
  draw(true);
})();
</script>
</body>
</html>
