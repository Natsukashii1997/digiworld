<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逆向 v6-C 工作流总控</title>
<!-- v6 C 版：主角是标准工作流本身。顶部板块是六步轨道（⏸ 是 Agent 停下等你的地方），每步下面是现在停在这一步的件数，两头是「未派出」和「已收成」；下面左边按步骤排的清单，右边是选中那件的档案。 -->
<link rel="stylesheet" href="../ui-v18/common.css"><link rel="stylesheet" href="../../../src/partner-lcd.css"><link rel="stylesheet" href="v19.css"><link rel="stylesheet" href="reverse-v6.css">
<style>.flow{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;align-items:center;gap:18px;padding:22px 24px}
.end{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:12px;border:1px dashed var(--line-3);font-size:12.5px;color:var(--text-2)}
.end .lcd{--h:24px}
.end.v{border-style:solid;border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.06)}
.lg6{display:flex;gap:18px;padding:0 24px 18px;font-size:12px;color:var(--muted)}
.lg6 b{color:var(--yellow);font-weight:600}
.two6{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.li6{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.li6:last-child{border-bottom:0}
.li6 .nob{grid-row:span 3;display:grid;place-items:center;width:40px;height:34px;border-radius:8px;background:#05080f;border:1px solid var(--line)}
.li6 .nob .lcd{--h:14px}
.li6 b{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.li6 small{font-size:12px;color:var(--muted)}
.li6 .tr{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}
.li6 .tr i{height:4px;border-radius:2px;background:#1c2742}
.li6 .tr i.d{background:var(--lcd)}.li6 .tr i.c{background:var(--orange);box-shadow:0 0 6px rgba(255,138,36,.7)}.li6 .tr i.x{background:#ff6b6b}
.li6.on{background:rgba(255,138,36,.06);box-shadow:inset 3px 0 0 var(--orange)}
.dos{padding:22px 24px}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dh h2{margin:0;font:800 22px var(--sans)}
.dh .src{font:500 12px var(--mono);color:var(--muted)}
.dh .acts{margin-left:auto;display:flex;gap:8px}
.gap{height:14px}</style></head>

<span class="grow"></span><button class="btn6 go">＋ 拆一件新东西</button></div>
<section class="blk"><div class="bh"><span class="no">标准工作流</span><h3>每次逆向都按这六步走</h3><span class="meta">工作台发话术、收回执；中间在 Agent 里做</span></div>

<script>
const { ITEMS, STAGE, B, lcd, tag } = RV6;
document.getElementById("rail").innerHTML = B.rail(null, [1, 0, 1, 1, 1, 0]);
const order = ["review", "copy", "sent", "plan", "done", "hold"];
document.getElementById("list").innerHTML = order.map((k) => ITEMS.find((i) => i.stage === k)).map((it, j) => { const at = STAGE[it.stage][2];
  return `<div class="li6 ${j === 0 ? "on" : ""}"><span class="nob">${lcd(it.no, j === 0 ? "o" : "m")}</span><b>${it.nick}${tag(it)}</b><small>${it.out ? "◆ " + it.out + " · 用了 " + it.uses + " 次" : it.next}</small>
  <div class="tr">${[0, 1, 2, 3, 4, 5].map((i) => `<i class="${it.stage === "hold" && i === 0 ? "x" : i < at ? "d" : i === at ? "c" : ""}"></i>`).join("")}</div></div>`; }).join("");
const it = ITEMS[0];
document.getElementById("dos").innerHTML = `<div class="dh"><h2>${it.nick}</h2>${tag(it)}<span class="src">${it.kind} · ${it.src}</span><div class="acts"><button class="btn6 sm">档案全文</button></div></div>
  ${B.pend()}<div class="gap"></div>${B.stats(it)}<div class="hr"></div>${B.nn()}<div class="hr"></div>${B.caps()}<div class="hr"></div>${B.slots()}`;

RV.lcds();
</script>
