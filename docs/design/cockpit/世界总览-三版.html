<title>数码世界 世界总览三版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* 布局：数码世界侧栏 + 主区；三版差在首页怎么组织「我有什么 / 进展到哪 / 去哪继续」。只做暗色，沿用 v18 基地的暴龙机语言。 */
:root{
  color-scheme:dark;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pixel:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#070b16;--panel:#0f1729;--panel-2:#131d33;--panel-3:#1a2641;--field:#0a1120;
  --line:rgba(140,178,255,.11);--line-2:rgba(140,178,255,.19);--line-3:rgba(140,178,255,.32);
  --text:#e9eeff;--text-2:#b4bfda;--muted:#8b98b8;--faint:#5d6987;
  --orange:#ff8a24;--orange-2:#ffb35c;--orange-ink:#1f0f00;--cyan:#4de3ff;--cyan-2:#9beeff;--lcd:#a6e36e;--violet:#a891ff;--yellow:#ffd166;--red:#ff6b6b;--blue:#6fb0ff;
  --lcd-screen:#aebc93;--lcd-ink:#1c2616;
  --m-panel:linear-gradient(180deg,#152039 0%,#0f1729 40%,#0c1325 100%);
  --m-panel-edge:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(140,178,255,.07),0 18px 40px -26px rgba(0,0,0,.95);
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--cyan);
  --r-1:6px;--r-2:10px;--r:12px;--r-l:16px;
  --f-12:12px;--f-13:13px;--f-14:14px;--f-16:16px;--f-20:20px;--f-28:28px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--f-14);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-1)}
canvas.spr{image-rendering:pixelated;display:block}
.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}

.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#04070f;border-bottom:1px solid var(--line-2);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#04070f}
.proto-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1600px;margin:0 auto}
.proto-tag{font-family:var(--mono);font-size:var(--f-12);letter-spacing:.08em;color:var(--muted)}
.proto-tabs{display:flex;gap:6px;flex-wrap:wrap}
.proto-tab{display:flex;align-items:baseline;gap:8px;padding:7px 14px;border-radius:var(--r-2);border:1px solid var(--line-2);color:var(--text-2);min-height:36px}
.proto-tab b{font-family:var(--pixel);font-weight:400;font-size:13px;color:var(--muted)}
.proto-tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);color:var(--orange-ink);font-weight:600}
.proto-tab[aria-selected="true"] b{color:var(--orange-ink)}
.proto-note{flex:1 1 280px;min-width:0;color:var(--muted);font-size:var(--f-13);margin:0}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 57px);max-width:1600px;margin:0 auto;border-inline:1px solid var(--line)}
.side{background:linear-gradient(180deg,#0b1222,#080d1a);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px;position:sticky;top:57px;height:calc(100vh - 57px)}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 8px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:radial-gradient(circle at 50% 50%,var(--orange) 0 5px,transparent 6px),repeating-conic-gradient(from 0deg,#ff8a24 0 8deg,transparent 8deg 30deg);box-shadow:inset 0 0 0 2px #2a1a0a,0 0 0 1px var(--line-2);background-color:#1a1206}
.logo b{display:block;font-size:19px;letter-spacing:.06em}
.logo small{display:block;font-family:var(--pixel);font-size:9px;letter-spacing:.18em;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--faint);padding:0 10px 4px;display:flex;justify-content:space-between}
.nav-h i{font-style:normal;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-2);color:var(--text-2);text-decoration:none;min-height:40px}
.nav a .ic{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;opacity:.7;flex:none}
.nav a .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:0 7px;border-radius:999px}
.nav a.on{background:linear-gradient(90deg,rgba(255,138,36,.16),rgba(255,138,36,.04));color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,138,36,.28)}
.nav a.on .ic{border-color:var(--orange);opacity:1}
.nav-end{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.partner{border-radius:var(--r-2);padding:8px;background:#1a2236;box-shadow:inset 0 0 0 1px var(--line-2)}
.partner-lcd{height:58px;border-radius:6px;background:var(--lcd-screen);background-image:radial-gradient(var(--lcd-ink) .6px,transparent .8px);background-size:4px 4px;opacity:.85;position:relative}
.partner-lcd::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:22px;transform:translate(-50%,-50%);background:#f6f2e4;border-radius:50% 50% 45% 45%;box-shadow:0 0 0 2px var(--lcd-ink)}
.partner small{display:block;margin-top:6px;font-size:11px;color:var(--muted)}
.main{min-width:0;padding-block:22px 56px;padding-inline:32px}
.crumb{display:flex;gap:8px;color:var(--muted);font-size:var(--f-13);margin-bottom:18px;align-items:center}
.crumb b{color:var(--text);font-weight:500}
.crumb .ro{margin-left:auto}

/* 通用 */
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.px{font-family:var(--pixel);letter-spacing:.08em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);padding:2px 8px;border-radius:var(--r-1);background:var(--panel-3);color:var(--text-2);border:1px solid var(--line);white-space:nowrap}
.st-ok{--s:var(--lcd)}.st-warn{--s:var(--yellow)}.st-bad{--s:var(--red)}.st-unk{--s:var(--faint)}.st-you{--s:var(--orange)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--s);box-shadow:0 0 8px color-mix(in srgb,var(--s) 55%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--s) 45%,transparent);color:var(--s);background:color-mix(in srgb,var(--s) 9%,transparent);white-space:nowrap}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);color:var(--lcd);border:1px solid rgba(166,227,110,.35);border-radius:999px;padding:2px 10px;background:rgba(166,227,110,.06)}
.ro::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lcd)}
.src{font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.5}
.note{font-size:var(--f-12);color:var(--faint)}
.muted{color:var(--muted)}
.panel{background:var(--m-panel);box-shadow:var(--m-panel-edge);border-radius:var(--r-l);min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.ph .key{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--cyan);box-shadow:inset 0 0 0 1.5px rgba(77,227,255,.5)}
.ph h2{margin:0;font-size:var(--f-16);font-weight:600}
.ph .big{margin-left:auto;font-family:var(--pixel);font-size:24px;line-height:1;color:var(--s,var(--cyan))}
.ph .r{margin-left:auto}

/* LED 时钟 */
.clock{display:flex;align-items:flex-end;gap:14px;justify-content:center}
.clock .t{font-family:var(--pixel);font-size:64px;line-height:.9;color:var(--cyan);text-shadow:0 0 18px rgba(77,227,255,.45);letter-spacing:.02em}
.clock .d b{display:block;font-size:var(--f-20);font-weight:600}
.clock .d span{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted)}
.greet{text-align:center;color:var(--text-2);margin-top:6px}
.greet b{color:var(--orange-2)}

/* 暴龙机 */
.digivice{width:300px;height:300px;position:relative;margin:0 auto}
.digivice svg{width:100%;height:100%;overflow:visible}
.digivice .screen{position:absolute;left:50%;top:50%;width:92px;height:92px;transform:translate(-50%,-50%);border-radius:12px;background:var(--lcd-screen);box-shadow:inset 0 0 0 3px #050913,0 0 0 2px rgba(77,227,255,.45),0 0 24px rgba(77,227,255,.25);display:grid;place-items:center;overflow:hidden}
.digivice .screen::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(28,38,22,.22) .7px,transparent .9px);background-size:3px 3px}
.idle canvas{animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* 快记 */
.quick{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:#0a1222;box-shadow:inset 0 0 0 1.5px rgba(77,227,255,.35),0 0 20px -8px rgba(77,227,255,.5)}
.quick span.p{font-family:var(--mono);color:var(--cyan)}
.quick input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:8px 0}
.quick input::placeholder{color:var(--faint)}
.quick kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px}
.quick button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(77,227,255,.6);color:var(--cyan);font-size:18px}

/* 行项目 */
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.it:hover{background:rgba(140,178,255,.03)}
.it b{display:block;font-size:var(--f-14);font-weight:600;line-height:1.35}
.it p{margin:2px 0 0;font-size:var(--f-12);color:var(--muted)}
.it .go{font-size:var(--f-12);color:var(--cyan);white-space:nowrap;padding-top:2px}
.it .dot{margin-top:6px}

/* 读数块 */
.reads{display:grid;gap:8px;padding:0 12px 12px}
.rd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 12px;border-radius:var(--r-2);background:rgba(6,10,20,.55);border:1px solid var(--line);text-align:left;width:100%}
.rd:hover{border-color:var(--line-3)}
.rd .n{font-family:var(--pixel);font-size:22px;line-height:1.1;grid-row:1/3;grid-column:2;align-self:center;color:var(--s,var(--text))}
.rd b{font-size:var(--f-14);font-weight:600}
.rd span{font-size:11.5px;color:var(--muted)}
.rd .src{grid-column:1/3}

/* ===== H1 暴龙机中枢 ===== */
.base{position:relative;border-radius:22px;padding:24px;background:radial-gradient(60% 50% at 50% 40%,rgba(77,227,255,.06),transparent 70%),linear-gradient(180deg,#0b1427,#08101f);box-shadow:inset 0 0 0 1px var(--line-2);overflow:hidden}
.base::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:repeating-linear-gradient(90deg,rgba(77,227,255,.05) 0 1px,transparent 1px 56px),linear-gradient(0deg,rgba(77,227,255,.05),transparent);mask:linear-gradient(0deg,#000,transparent);pointer-events:none}
.h1grid{display:grid;grid-template-columns:minmax(0,1fr) 380px minmax(0,1fr);gap:24px;align-items:start;position:relative;z-index:1}
.h1mid{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.wire{position:absolute;inset:0;pointer-events:none;z-index:0}
.h1grid .panel{border:1px solid rgba(255,138,36,.0)}
.h1grid .pa{box-shadow:var(--m-panel-edge),inset 0 0 0 1px rgba(255,138,36,.25)}
.pa .ph .key{color:var(--orange);box-shadow:inset 0 0 0 1.5px rgba(255,138,36,.55)}
.recent{margin-top:20px;position:relative;z-index:1}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.chg{flex:0 0 250px;padding:12px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);min-width:0}
.chg b{display:block;font-size:var(--f-13);font-weight:600}
.chg p{margin:3px 0 0;font-size:var(--f-12);color:var(--muted)}
.chg .src{margin-top:6px}

/* ===== H2 驾驶舱仪表板 ===== */
.h2top{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.h2top .clock{justify-content:flex-start}
.h2top .clock .t{font-size:40px}
.h2top .greet{text-align:left;margin:0}
.h2top .quick{margin-left:auto;flex:1 1 380px;max-width:520px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-radius:var(--r-l);background:var(--m-panel);box-shadow:var(--m-panel-edge);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.kpi .n{font-family:var(--pixel);font-size:30px;line-height:1.1}
.kpi .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.kpi .bar i{display:block;height:100%}
.kpi p{margin:0;font-size:var(--f-12);color:var(--muted)}
.h2mid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
.squad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px 12px}
.mate{--tint:var(--orange);display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:var(--r);background:linear-gradient(110deg,color-mix(in srgb,var(--tint) 10%,#0e1628),#0b1222 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 22%,transparent);text-align:left;min-width:0}
.mate .av{width:64px;height:64px;border-radius:10px;background:#070c18;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 35%,transparent)}
.mate b{display:block;font-size:var(--f-14)}
.mate small{display:block;font-size:11px;color:var(--muted)}
.mate .q{display:grid;grid-template-columns:28px minmax(0,1fr) 34px;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:4px}
.mate .q .b{height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden}.mate .q .b i{display:block;height:100%;background:var(--s)}
.mate .q span:last-child{font-family:var(--mono);text-align:right}
.projmap{padding:0 12px 12px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.ptype:not(:first-child) .pcells{grid-template-columns:minmax(0,1fr)}
.ptype h4{margin:0 0 8px;font-size:var(--f-13);font-weight:600;display:flex;gap:8px;align-items:center}
.ptype h4 span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pcells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pc{padding:8px 10px;border-radius:var(--r-2);background:rgba(6,10,20,.55);border:1px solid var(--line);min-width:0;border-left:3px solid var(--s)}
.pc b{display:block;font-size:var(--f-12);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc span{font-size:11px;color:var(--muted)}

/* ===== H3 三个问题 ===== */
.h3head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;margin-bottom:22px;padding:22px 24px;border-radius:20px;background:radial-gradient(50% 120% at 85% 50%,rgba(77,227,255,.08),transparent 70%),linear-gradient(180deg,#0b1427,#08101f);box-shadow:inset 0 0 0 1px var(--line-2)}
.h3head h1{margin:0;font-size:30px;line-height:1.25;font-weight:650;text-wrap:balance}
.h3head h1 em{font-style:normal;color:var(--orange-2)}
.h3head p{margin:8px 0 14px;color:var(--text-2)}
.h3head .clock{flex-direction:column;align-items:flex-end;gap:6px}
.h3head .clock .t{font-size:48px}
.q3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.qcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.qh{display:flex;gap:12px;align-items:baseline;padding:0 4px}
.qh .no{font-family:var(--pixel);font-size:28px;line-height:1;color:var(--cyan)}
.qh h2{margin:0;font-size:var(--f-20);font-weight:650}
.qh p{margin:2px 0 0;font-size:var(--f-12);color:var(--muted)}
.own{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.own .rd .n{font-size:24px}
.tlist{list-style:none;margin:0;padding:6px 14px 10px}
.tlist li{display:grid;grid-template-columns:46px 12px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tlist li:last-child{border-bottom:0}
.tlist .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.tlist i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c,var(--cyan))}
.tlist b{display:block;font-size:var(--f-13);font-weight:600}
.tlist span{display:block;font-size:11.5px;color:var(--muted)}
.mine{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}

@media (max-width:1280px){.h1grid{grid-template-columns:minmax(0,1fr) 340px}.h1grid>.pb{grid-column:1/-1}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.h2mid,.q3{grid-template-columns:minmax(0,1fr)}.projmap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .main{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .h1grid,.kpis,.squad,.own,.h3head{grid-template-columns:minmax(0,1fr)}.clock .t{font-size:44px}.digivice{width:240px;height:240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="proto" role="region" aria-label="原型方案切换">
  <div class="proto-in">
    <span class="proto-tag">世界总览 · 3 版</span>
    <div class="proto-tabs" role="tablist" aria-label="方案">
      <button class="proto-tab" role="tab" id="pt-1" data-v="1" aria-selected="true"><b>H1</b>暴龙机中枢</button>
      <button class="proto-tab" role="tab" id="pt-2" data-v="2" aria-selected="false"><b>H2</b>驾驶舱仪表板</button>
      <button class="proto-tab" role="tab" id="pt-3" data-v="3" aria-selected="false"><b>H3</b>三个问题</button>
    </div>
    <p class="proto-note" id="proto-note"></p>
  </div>
</div>

<div class="app">
  <aside class="side" aria-label="侧栏">
    <div class="logo"><span class="logo-mark" aria-hidden="true"></span><div><b>数码世界</b><small>DIGITAL·WORLD</small></div></div>
    <nav class="nav" aria-label="主导航">
      <div>
        <div class="nav-h">体系 <i>只读</i></div>
        <a href="#h1" onclick="return false" class="on" aria-current="page"><span class="ic"></span>世界总览</a>
        <a href="#h1" onclick="return false"><span class="ic"></span>项目空间<span class="ct">16</span></a>
        <a href="#h1" onclick="return false"><span class="ic"></span>Agent<span class="ct">4</span></a>
        <a href="#h1" onclick="return false"><span class="ic"></span>自建 Skill<span class="ct">15</span></a>
        <a href="#h1" onclick="return false"><span class="ic"></span>规则</a>
      </div>

 </section>`;}

};
let V='1';
function render(){
 document.querySelectorAll('.proto-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===V)));

 const view=document.getElementById('view');view.innerHTML=V==='1'?v1():V==='2'?v2():v3();hydrate(view);
}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.v){V=t.dataset.v;history.replaceState(null,'','#h'+V);render();window.scrollTo({top:0});}});
function fromHash(){const h=location.hash.slice(1);if(['h1','h2','h3'].includes(h))V=h.slice(1);render();}
window.addEventListener('hashchange',fromHash);fromHash();
