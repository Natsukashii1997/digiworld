<title>数码世界 规则页三版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* 布局：数码世界侧栏 + 主区；顶部原型切换栏。三版差在信息组织：分层总表 / 偏好落地为中心 / 巡检优先。只做暗色。 */
:root{
  color-scheme:dark;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pixel:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#070b16;--panel:#0f1729;--panel-2:#131d33;--panel-3:#1a2641;--field:#0a1120;
  --line:rgba(140,178,255,.11);--line-2:rgba(140,178,255,.19);--line-3:rgba(140,178,255,.32);
  --text:#e9eeff;--text-2:#b4bfda;--muted:#8b98b8;--faint:#5d6987;
  --orange:#ff8a24;--orange-2:#ffb35c;--orange-ink:#1f0f00;--cyan:#4de3ff;--lcd:#a6e36e;--violet:#a891ff;--yellow:#ffd166;--red:#ff6b6b;--blue:#6fb0ff;--pink:#ff7ad1;
  --lcd-screen:#aebc93;--lcd-ink:#1c2616;
  --m-panel:linear-gradient(180deg,#152039 0%,#0f1729 40%,#0c1325 100%);
  --m-panel-edge:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(140,178,255,.07),0 18px 40px -26px rgba(0,0,0,.95);
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--cyan);
  --r-1:6px;--r-2:10px;--r:12px;--r-l:16px;
  --f-12:12px;--f-13:13px;--f-14:14px;--f-16:16px;--f-20:20px;--f-28:28px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--f-14);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-1)}
.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}

.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#04070f;border-bottom:1px solid var(--line-2);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#04070f}
.proto-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1600px;margin:0 auto}
.proto-tag{font-family:var(--mono);font-size:var(--f-12);letter-spacing:.08em;color:var(--muted)}
.proto-tabs{display:flex;gap:6px;flex-wrap:wrap}
.proto-tab{display:flex;align-items:baseline;gap:8px;padding:7px 14px;border-radius:var(--r-2);border:1px solid var(--line-2);color:var(--text-2);min-height:36px}
.proto-tab b{font-family:var(--pixel);font-weight:400;font-size:13px;color:var(--muted)}
.proto-tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);color:var(--orange-ink);font-weight:600}
.proto-tab[aria-selected="true"] b{color:var(--orange-ink)}
.proto-note{flex:1 1 280px;min-width:0;color:var(--muted);font-size:var(--f-13);margin:0}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 57px);max-width:1600px;margin:0 auto;border-inline:1px solid var(--line)}
.side{background:linear-gradient(180deg,#0b1222,#080d1a);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px;position:sticky;top:57px;height:calc(100vh - 57px)}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 8px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:radial-gradient(circle at 50% 50%,var(--orange) 0 5px,transparent 6px),repeating-conic-gradient(from 0deg,#ff8a24 0 8deg,transparent 8deg 30deg);box-shadow:inset 0 0 0 2px #2a1a0a,0 0 0 1px var(--line-2);background-color:#1a1206}
.logo b{display:block;font-size:19px;letter-spacing:.06em}
.logo small{display:block;font-family:var(--pixel);font-size:9px;letter-spacing:.18em;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--faint);padding:0 10px 4px;display:flex;justify-content:space-between}
.nav-h i{font-style:normal;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-2);color:var(--text-2);text-decoration:none;min-height:40px}
.nav a .ic{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;opacity:.7;flex:none}
.nav a .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:0 7px;border-radius:999px}
.nav a.on{background:linear-gradient(90deg,rgba(255,138,36,.16),rgba(255,138,36,.04));color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,138,36,.28)}
.nav a.on .ic{border-color:var(--orange);opacity:1}
.nav-end{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.partner{border-radius:var(--r-2);padding:8px;background:#1a2236;box-shadow:inset 0 0 0 1px var(--line-2)}
.partner-lcd{height:58px;border-radius:6px;background:var(--lcd-screen);background-image:radial-gradient(var(--lcd-ink) .6px,transparent .8px);background-size:4px 4px;opacity:.85;position:relative}
.partner-lcd::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:22px;transform:translate(-50%,-50%);background:#f6f2e4;border-radius:50% 50% 45% 45%;box-shadow:0 0 0 2px var(--lcd-ink)}
.partner small{display:block;margin-top:6px;font-size:11px;color:var(--muted)}

.main{min-width:0;padding-block:22px 56px;padding-inline:32px}
.crumb{display:flex;gap:8px;color:var(--muted);font-size:var(--f-13);margin-bottom:18px}
.crumb b{color:var(--text);font-weight:500}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:30px;line-height:1.1;font-weight:650}
.head .en{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);margin-left:10px}
.head p{margin:8px 0 0;color:var(--text-2);max-width:62ch}
.head-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);color:var(--lcd);border:1px solid rgba(166,227,110,.35);border-radius:999px;padding:3px 10px;background:rgba(166,227,110,.06)}
.ro::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lcd)}
.read{font-family:var(--mono);font-size:var(--f-12);color:var(--muted)}
.btn{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:var(--r-2);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text-2);font-size:var(--f-13)}

/* 通用 */
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);padding:2px 8px;border-radius:var(--r-1);background:var(--panel-3);color:var(--text-2);border:1px solid var(--line);white-space:nowrap}
.chip.p{font-family:var(--mono);color:var(--violet);border-color:rgba(168,145,255,.3);background:rgba(168,145,255,.08)}
.chip.g{font-family:var(--mono);color:var(--cyan);border-color:rgba(77,227,255,.3);background:rgba(77,227,255,.07)}
.chip.must{color:var(--orange-2);border-color:rgba(255,138,36,.35);background:rgba(255,138,36,.08)}
.st-ok{--s:var(--lcd)}.st-warn{--s:var(--yellow)}.st-bad{--s:var(--red)}.st-unk{--s:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--s);box-shadow:0 0 8px color-mix(in srgb,var(--s) 55%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--s) 45%,transparent);color:var(--s);background:color-mix(in srgb,var(--s) 9%,transparent);white-space:nowrap}
.src{font-family:var(--mono);font-size:11.5px;color:var(--faint);line-height:1.5}
.src b{font-weight:400;color:var(--muted)}
.note{font-size:var(--f-12);color:var(--faint)}
.muted{color:var(--muted)}
.crest{width:28px;height:28px;flex:none;color:var(--c)}
.crest.lg{width:40px;height:40px}
.sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:76px}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:var(--f-20);font-weight:650}
.sec-h .what{color:var(--muted);font-size:var(--f-13)}
.sec-h .meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);min-width:0}
.tw{overflow-x:auto;border-radius:var(--r-l);border:1px solid var(--line);background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--f-13)}
th,td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:#111a2f;color:var(--muted);font-weight:500;font-size:var(--f-12);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:24px;padding:0 8px;border-radius:var(--r-1);font-size:var(--f-12);font-weight:500}
.cell.y{background:rgba(166,227,110,.13);color:var(--lcd)}
.cell.p{background:rgba(255,209,102,.13);color:var(--yellow)}
.cell.n{background:rgba(255,107,107,.12);color:var(--red-2,#ff9a9a)}
.cell.u{background:rgba(93,105,135,.15);color:var(--faint)}
.cell.x{box-shadow:inset 0 0 0 1.5px var(--yellow)}
.hit{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center;min-width:120px}
.hit .b{height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.hit .b i{display:block;height:100%;background:var(--cyan)}
.hit span{font-family:var(--mono);font-size:12px;text-align:right;color:var(--text-2)}
.hit.hot .b i{background:var(--yellow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.guard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.guard b{font-size:var(--f-14)}
.guard .who{display:flex;gap:6px;flex-wrap:wrap}
.guard p{margin:0;font-size:var(--f-12);color:var(--muted)}
.issue{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.issue:last-child{border-bottom:0}
.issue .k{font-family:var(--pixel);font-size:12px;color:var(--s);padding-top:2px}
.issue b{display:block;font-size:var(--f-14);font-weight:600}
.issue p{margin:2px 0 0;font-size:var(--f-12);color:var(--muted)}
.tl{list-style:none;margin:0;padding:6px 14px;display:grid}
.tl li{display:grid;grid-template-columns:52px 14px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;font-size:var(--f-13)}
.tl li .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tl li i{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--c,var(--cyan));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--cyan)) 18%,transparent)}
.tl li span.s{display:block;font-size:11.5px;color:var(--faint)}
.srcs{display:flex;flex-wrap:wrap;gap:6px 18px}

/* R1 分层总表 */
.r1{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
.toc1{position:sticky;top:76px;display:flex;flex-direction:column;gap:4px}
.toc1 a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-2);text-decoration:none;color:var(--text-2);font-size:var(--f-13);min-height:44px}
.toc1 a:hover{background:var(--panel-2)}
.toc1 a.on{background:var(--panel-3);color:var(--text)}
.toc1 a small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.toc1 .crest{width:22px;height:22px}
.r1-body{display:flex;flex-direction:column;gap:34px;min-width:0}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--m-panel-edge)}
.strip>div{background:var(--panel);padding:14px 16px;min-width:0}
.strip .v{font-family:var(--pixel);font-size:24px;line-height:1.2;margin:4px 0 2px}
.strip .v small{font-family:var(--sans);font-size:var(--f-13);color:var(--muted);margin-left:4px}
.strip p{margin:0;font-size:var(--f-12);color:var(--muted)}

/* R2 偏好落地为中心 */
.r2-top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.mx tbody tr{cursor:pointer}
.mx tbody tr:hover td{background:rgba(140,178,255,.035)}
.mx tbody tr.on td{background:rgba(168,145,255,.08)}
.mx tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--violet)}
.mx td,.mx th{text-align:center}
.mx td:nth-child(2),.mx th:nth-child(2),.mx td:first-child,.mx th:first-child{text-align:left}
.detail{position:sticky;top:76px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--m-panel);box-shadow:var(--m-panel-edge);border:0}
.detail h3{margin:0;font-size:var(--f-20)}
.where{display:grid;gap:6px}
.where div{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:var(--f-13)}
.bars{display:flex;flex-direction:column;gap:6px;padding:14px}
.bars .row{display:grid;grid-template-columns:52px minmax(0,1fr) 220px;gap:10px;align-items:center;font-size:var(--f-13)}
.bars .row .t{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--f-12)}
.r2-low{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.projgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.proj{border:1px solid var(--line);border-radius:var(--r-2);padding:9px 11px;background:var(--panel);min-width:0}
.proj b{display:block;font-size:var(--f-13);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj span{font-size:11.5px;color:var(--muted)}

/* R3 巡检优先 */
.post{border-radius:var(--r-l);background:var(--m-panel);box-shadow:var(--m-panel-edge);overflow:hidden}
.post-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.post-h .tag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.post-h .sum{margin-left:auto;display:flex;gap:14px;font-size:var(--f-13)}
.post-h .sum span{display:inline-flex;align-items:center;gap:6px}
.grp{padding:8px 18px 4px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--faint);background:#0b1324;border-bottom:1px solid var(--line)}
.chk{display:grid;grid-template-columns:44px 30px minmax(0,1fr) minmax(0,260px) auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.chk .g{font-family:var(--mono);font-size:13px;color:var(--s);font-weight:600}
.chk b{display:block;font-size:var(--f-14);font-weight:600}
.chk p{margin:2px 0 0;font-size:var(--f-12);color:var(--muted)}
.chk .fix{font-size:var(--f-12);color:var(--text-2);min-width:0}
.chk .fix span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--faint);overflow-wrap:anywhere}
.chk.bad{background:linear-gradient(90deg,rgba(255,107,107,.07),transparent 40%)}
.layers{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0 12px}
.layer-tab{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:var(--r-2);border:1px solid var(--line-2);font-size:var(--f-13);color:var(--text-2);min-height:40px}
.layer-tab .crest{width:22px;height:22px}
.layer-tab[aria-selected="true"]{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 9%,transparent)}
.layer-tab small{font-family:var(--mono);font-size:11px;color:var(--muted)}

@media (max-width:1240px){.r2-top,.r2-low{grid-template-columns:minmax(0,1fr)}.detail{position:static}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.chk{grid-template-columns:44px 30px minmax(0,1fr) auto}.chk .fix{display:none}.projgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .main{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .r1{grid-template-columns:minmax(0,1fr)}.toc1{position:static}.strip,.grid2,.grid3,.projgrid{grid-template-columns:minmax(0,1fr)}
  .chk{grid-template-columns:36px minmax(0,1fr)}.chk .crest,.chk>.pill{display:none}.bars .row{grid-template-columns:44px minmax(0,1fr) 120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="proto" role="region" aria-label="原型方案切换">
  <div class="proto-in">
    <span class="proto-tag">规则页 · 定稿</span>
    <div class="proto-tabs" role="tablist" aria-label="方案"><button class="proto-tab" role="tab" id="pt-1" data-v="1" aria-selected="true"><b>R1</b>分层总表 · 已定稿</button></div>
    <p class="proto-note" id="proto-note"></p>
  </div>
</div>

<div class="app">
  <aside class="side" aria-label="侧栏">
    <div class="logo"><span class="logo-mark" aria-hidden="true"></span><div><b>数码世界</b><small>DIGITAL·WORLD</small></div></div>
    <nav class="nav" aria-label="主导航">
      <div>
        <div class="nav-h">体系 <i>只读</i></div>
        <a href="#r1" onclick="return false"><span class="ic"></span>世界总览</a>

        <a href="#r1" onclick="return false"><span class="ic"></span>Agent<span class="ct">4</span></a>
        <a href="#r1" onclick="return false"><span class="ic"></span>自建 Skill<span class="ct">15</span></a>
        <a href="#r1" onclick="return false" class="on" aria-current="page"><span class="ic"></span>规则</a>
      </div>
      <div>
        <div class="nav-h">我的素材 <i>可写</i></div>
        <a href="#r1" onclick="return false"><span class="ic"></span>资产仓库<span class="ct">9</span></a>
        <a href="#r1" onclick="return false"><span class="ic"></span>个人收藏<span class="ct">15</span></a>
        <a href="#r1" onclick="return false"><span class="ic"></span>随手记<span class="ct">20</span></a>
        <a href="#r1" onclick="return false"><span class="ic"></span>逆向工程</a>
      </div>
    </nav>
    <div class="nav-end">
      <nav class="nav" aria-label="系统"><a href="#r1" onclick="return false"><span class="ic"></span>设置</a></nav>
      <div class="partner" aria-hidden="true"><div class="partner-lcd"></div><small>冬 · 初雪 · 数码蛋（原样保留）</small></div>
    </div>
  </aside>

  <main class="main">
    <div class="crumb">数码世界 <span aria-hidden="true">/</span> <b>规则</b></div>
    <header class="head">

 const mx=`<div class="tw"><table class="mx"><thead><tr><th>编号</th><th>偏好</th><th>Vault</th><th>Claude</th><th>Codex</th><th>Hermes 私人</th><th>Hermes 企业</th><th>机器守护</th></tr></thead><tbody>${P.map((r,i)=>`<tr class="${i===PSEL?'on':''}" data-p="${i}" tabindex="0"><td><span class="chip p">${r[0]}</span></td><td>${esc(r[1])}</td><td>${cell('y')}</td><td>${cell(r[2],r[7])}</td><td>${cell(r[3],r[7])}</td><td>${cell(r[4])}</td><td>${cell(r[5])}</td><td>${r[0]==='P-11'?'<span class="chip">候选</span>':'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
 const where=[['Vault 偏好表','y','个人上下文/当前人机协作偏好.md'],['Claude','  '+p[2],p[2]==='y'?'CLAUDE.md §'+(+p[0].slice(2)+1):'CLAUDE.md'],['Codex',p[3],'AGENTS.md'],['Hermes 私人',p[4],'SOUL.md / memories/USER.md'],['Hermes 企业',p[5],'profiles/agumon']].map(w=>`<div><span class="muted">${w[0]}</span><span class="src" style="overflow-wrap:anywhere">${esc(w[2])}</span>${cell(w[1].trim())}</div>`).join('');
 const bars=[...G].sort((a,b)=>b[3]-a[3]).map(g=>`<div class="row"><span class="chip g">${g[0]}</span><span class="t">${esc(g[1])}${g[4]?' · 每次都要守':''}</span>${hit(g[3])}</div>`).join('');
 return `<div style="display:flex;flex-direction:column;gap:30px">
  <section class="sec">${secHead('land','<span class="chip">点一行看详情</span>')}
   <div class="r2-top">${mx}
    <aside class="panel detail" aria-label="${p[0]} 详情"><div style="display:flex;align-items:center;gap:10px">${crest('爱心','lg')}<div><span class="chip p">${p[0]}</span><h3>${esc(p[1])}</h3></div></div>
     <div class="where">${where}</div>
     ${p[6]?`<div class="note" style="color:var(--text-2)">${esc(p[6])}</div>`:''}
     ${rel.length?`<div><span class="lbl">相关问题</span>${rel.map(i=>`<div class="issue st-${i[4]}" style="padding:8px 0;grid-template-columns:36px minmax(0,1fr)"><span class="k">${i[0]}</span><div><b style="font-size:13px">${esc(i[2])}</b></div></div>`).join('')}</div>`:''}
     <span class="src"><b>正文</b> 受限，不在这里显示 · 在 Obsidian 打开</span>
     <span class="src"><b>落地依据</b> 审核包 11-07 11:30</span></aside></div></section>
  <div class="r2-low">
   <section class="sec">${secHead('eng')}<div class="panel bars">${bars}</div><div class="note">按命中次数排序；命中＝出现触发词，不等于真犯。G-15 多半是误报（推断）。</div></section>
   <section class="sec">${secHead('guard')}<div class="panel" style="padding:4px 0">${GUARD.map(g=>`<div class="issue st-ok" style="grid-template-columns:24px minmax(0,1fr)"><span class="k">${dot('ok')}</span><div><b style="font-size:13px">${esc(g[0])}</b><p>${esc(g[1])} · 守 ${esc(g[3])}</p></div></div>`).join('')}</div>
    <div class="panel" style="padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${pill('ok','自检 7 / 7 通过')}<span class="note">11-07 12:15</span></div></section>
  </div>
  <section class="sec">${secHead('proj')}<div class="projgrid">${PROJ.map(p=>`<div class="proj"><b>${esc(p[0])}</b><span>${TYPE[p[1]]} · ${p[2]==null?'<span style="color:var(--yellow)">无 AGENTS</span>':'AGENTS '+p[2]+' 行'} · LESSONS ${p[4]}</span></div>`).join('')}</div></section>
  <section class="sec">${secHead('issue')}<div class="grid2">${issues()}${timeline()}</div></section>
 </div>`;}

/* ---------- R3 巡检优先 ---------- */
let LSEL='pref';
const CHECKS=[
 ['bad','✗','光明','P-08 预览形式三处说法不一','Claude 只认网页链接；Codex 和 Vault 允许截图','改 Vault P-08 后同步两份全局指令','agent-kit global/ → PR'],
 ['bad','✗','光明','交接时机 Claude 和 Codex 相反','Claude 等 hook 提醒；Codex 主动提醒','定一种，改另一份','agent-kit global/ → PR'],
 ['bad','✗','光明','改一条全局规则要改哪几处，没有写','P-10 漏登 6 天就是因此','在《工程流程》补一节','agent-kit/工程流程.md'],
 ['warn','!','友情','P-02、P-05、P-06、P-07 只写在 Codex','Claude 不知道你的岗位和「不读代码」','决定是否同步给 Claude','agent-kit global/claude'],
 ['warn','!','友情','Hermes 两个分身的指令没写偏好编号','私人分身记忆里有索引；企业分身未核','核对后补索引','~/.hermes/…/USER.md'],
 ['warn','!','知识','G-15 提醒 3 天命中 331 次','触发词 .app/Contents 太宽，多半是误报（推断）','收窄触发词','agent-kit LESSONS.md'],
 ['warn','!','诚实','P-11 收尾三行只靠自觉','可加 Stop hook 检查最后三行','你决定要不要','agent-kit hooks/'],
 ['warn','!','希望','CarvoMOTO-汽配 没有 AGENTS.md','按名册路径没找到，可能路径变了','核对名册路径','digital-twin/projects.json'],
 ['ok','✓','诚实','两份全局指令和仓库版一致','自检 12:15；本页读取时预览也一致','',''],
 ['ok','✓','诚实','强推 main 会被拦下','hook 实跑通过','',''],
 ['ok','✓','诚实','Claude 16 条拒绝规则、Codex 执行策略都在','hook 与仓库一致','',''],
 ['ok','✓','知识','全局坑提醒在工作','11-05 起命中 1,851 次','',''],
 ['ok','●','希望','Claude 项目记忆 0 条','自动记忆默认开启，还没记过','','']
];
function v3(){
 const grp=(st,t)=>{const rows=CHECKS.filter(c=>c[0]===st);return `<div class="grp">${t} · ${rows.length}</div>${rows.map(c=>`<div class="chk st-${c[0]} ${c[0]==='bad'?'bad':''}"><span class="g">[${c[1]}]</span>${crest(c[2])}<div style="min-width:0"><b>${esc(c[3])}</b><p>${esc(c[4])}</p></div><div class="fix">${c[5]?esc(c[5]):''}${c[6]?`<span>${esc(c[6])}</span>`:''}</div>${c[0]==='ok'?pill('ok','正常'):c[0]==='bad'?pill('bad','要处理'):pill('warn','要看一眼')}</div>`).join('')}`;};
 const l=L(LSEL);
 const body={pref:prefTable,land:landSummary,eng:()=>gTable(true),guard:guards,proj:projTable,issue:()=>`<div class="grid2">${issues()}${timeline()}</div>`}[LSEL]();
 return `<section class="post" aria-label="规则巡检"><div class="post-h"><span class="tag">RULE CHECK · 规则巡检</span><span class="note">读取于 11-07 23:20 · 自检 12:15 · 审核包 11:30</span>
   <div class="sum"><span>${dot('bad')} 要处理 3</span><span>${dot('warn')} 要看一眼 5</span><span>${dot('ok')} 正常 5</span></div></div>
   ${grp('bad','要处理')}${grp('warn','要看一眼')}${grp('ok','正常')}
   <div style="padding:10px 18px" class="note">每行右边是去哪改；这里不改，只告诉你。</div></section>
  <div class="layers" role="tablist" aria-label="按块浏览">${LAYERS.map(x=>`<button type="button" class="layer-tab" role="tab" data-l="${x.id}" aria-selected="${x.id===LSEL}" style="--c:${CREST[x.cr].c}">${crest(x.cr)}${x.n}<small>${x.count}</small></button>`).join('')}</div>
  <section class="sec">${secHead(LSEL)}${body}</section>`;}

const NOTES={
 '1':'11-07 已定：R1 分层总表。6 块按顺序排，左边目录跟随滚动，顶部 5 个数。',
 '2':'思路：以「每条偏好在各 Agent 那里有没有落地」这张表为中心，点一行看它写在哪、有什么冲突；其他块放下面。适合查漏和对齐。',
 '3':'思路：先告诉你哪里有问题、去哪改（和设置页的自检同一种样式），再按块浏览明细。适合定期巡检。'
};
let V='1';
function render(){
 document.querySelectorAll('.proto-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===V)));
 document.getElementById('proto-note').textContent=NOTES[V];
 document.getElementById('view').innerHTML=V==='1'?v1():V==='2'?v2():v3();
}
document.addEventListener('click',e=>{
 const tr=e.target.closest('tr[data-p]'); if(tr){PSEL=+tr.dataset.p;render();return;}
 const a=e.target.closest('a[data-jump]'); if(a){e.preventDefault();document.getElementById('s-'+a.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.toc1 a').forEach(x=>x.classList.toggle('on',x===a));return;}
 const t=e.target.closest('button'); if(!t) return;
 if(t.dataset.v){V=t.dataset.v;history.replaceState(null,'','#r'+V);render();window.scrollTo({top:0});}
 else if(t.dataset.l){LSEL=t.dataset.l;render();}
 else if(t.id==='refresh'){t.textContent='已重新读取 · 原型不联动';setTimeout(()=>t.textContent='重新读取',1600);}
});
document.addEventListener('keydown',e=>{const tr=e.target.closest&&e.target.closest('tr[data-p]');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();PSEL=+tr.dataset.p;render();}});
function fromHash(){V='1';render();}
window.addEventListener('hashchange',fromHash);fromHash();
/* R1：目录跟随滚动高亮 */
window.addEventListener('scroll',()=>{if(V!=='1')return;let cur=LAYERS[0].id;for(const l of LAYERS){const el=document.getElementById('s-'+l.id);if(el&&el.getBoundingClientRect().top<140)cur=l.id;}document.querySelectorAll('.toc1 a').forEach(a=>a.classList.toggle('on',a.dataset.jump===cur));},{passive:true});
</script>
