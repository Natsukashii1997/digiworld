<title>数码世界 Agent 页三版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* 布局：数码世界侧栏 + 主区；C「单个档案」骨架不变，三版只换「数码兽形象怎么出场」。只做暗色，与正式产品一致。 */
:root{
  color-scheme:dark;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pixel:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
  --bg:#070b16;--panel:#0f1729;--panel-2:#131d33;--panel-3:#1a2641;--field:#0a1120;
  --line:rgba(140,178,255,.11);--line-2:rgba(140,178,255,.19);--line-3:rgba(140,178,255,.32);
  --text:#e9eeff;--text-2:#b4bfda;--muted:#8b98b8;--faint:#5d6987;
  --orange:#ff8a24;--orange-2:#ffb35c;--orange-ink:#1f0f00;--cyan:#4de3ff;--lcd:#a6e36e;--violet:#a891ff;--yellow:#ffd166;--red:#ff6b6b;--blue:#6fb0ff;
  --lcd-screen:#aebc93;--lcd-screen-2:#97a77c;--lcd-ink:#1c2616;--lcd-mid:#6f7d58;--lcd-shade:#3d4a2c;--lcd-hi:#d6e8b4;
  --hw-bezel:#1b2540;--hw-bezel-hi:#24345c;--hw-deep:#0b172a;--hw-pit:#050913;--hw-key:#4a5a7d;--hw-key-2:#1a2337;
  --m-panel:linear-gradient(180deg,#152039 0%,#0f1729 40%,#0c1325 100%);
  --m-panel-edge:inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 0 1px rgba(140,178,255,.07),0 18px 40px -26px rgba(0,0,0,.95);
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--cyan);
  --r-1:6px;--r-2:10px;--r:12px;--r-l:16px;
  --f-12:12px;--f-13:13px;--f-14:14px;--f-16:16px;--f-20:20px;--f-28:28px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--f-14);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-1)}
canvas.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}

/* 原型切换栏 */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#04070f;border-bottom:1px solid var(--line-2);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#04070f}
.proto-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1600px;margin:0 auto}
.proto-tag{font-family:var(--mono);font-size:var(--f-12);letter-spacing:.08em;color:var(--muted)}
.proto-tabs{display:flex;gap:6px;flex-wrap:wrap}
.proto-tab{display:flex;align-items:baseline;gap:8px;padding:7px 14px;border-radius:var(--r-2);border:1px solid var(--line-2);color:var(--text-2);min-height:36px}
.proto-tab b{font-family:var(--pixel);font-weight:400;font-size:13px;color:var(--muted)}
.proto-tab[aria-selected="true"]{background:var(--orange);border-color:var(--orange);color:var(--orange-ink);font-weight:600}
.proto-tab[aria-selected="true"] b{color:var(--orange-ink)}
.proto-note{flex:1 1 280px;min-width:0;color:var(--muted);font-size:var(--f-13);margin:0}

/* 应用外框 */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 57px);max-width:1600px;margin:0 auto;border-inline:1px solid var(--line)}
.side{background:linear-gradient(180deg,#0b1222,#080d1a);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px;position:sticky;top:57px;height:calc(100vh - 57px)}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px 8px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:radial-gradient(circle at 50% 50%,var(--orange) 0 5px,transparent 6px),repeating-conic-gradient(from 0deg,#ff8a24 0 8deg,transparent 8deg 30deg);box-shadow:inset 0 0 0 2px #2a1a0a,0 0 0 1px var(--line-2);background-color:#1a1206}
.logo b{display:block;font-size:19px;letter-spacing:.06em}
.logo small{display:block;font-family:var(--pixel);font-size:9px;letter-spacing:.18em;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--faint);padding:0 10px 4px;display:flex;justify-content:space-between}
.nav-h i{font-style:normal;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-2);color:var(--text-2);text-decoration:none;min-height:40px}
.nav a .ic{width:16px;height:16px;border:1.5px solid currentColor;border-radius:4px;opacity:.7;flex:none}
.nav a .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:0 7px;border-radius:999px}
.nav a.on{background:linear-gradient(90deg,rgba(255,138,36,.16),rgba(255,138,36,.04));color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,138,36,.28)}
.nav a.on .ic{border-color:var(--orange);opacity:1}
.nav-end{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.partner{border-radius:var(--r-2);padding:8px;background:#1a2236;box-shadow:inset 0 0 0 1px var(--line-2)}
.partner-lcd{height:58px;border-radius:6px;background:var(--lcd-screen);background-image:radial-gradient(var(--lcd-ink) .6px,transparent .8px);background-size:4px 4px;opacity:.85;position:relative}
.partner-lcd::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:22px;transform:translate(-50%,-50%);background:#f6f2e4;border-radius:50% 50% 45% 45%;box-shadow:0 0 0 2px var(--lcd-ink)}
.partner small{display:block;margin-top:6px;font-size:11px;color:var(--muted)}

.main{min-width:0;padding-block:22px 48px;padding-inline:32px}
.crumb{display:flex;gap:8px;color:var(--muted);font-size:var(--f-13);margin-bottom:18px}
.crumb b{color:var(--text);font-weight:500}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:30px;line-height:1.1;font-weight:650}
.head .en{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);margin-left:10px}
.head p{margin:8px 0 0;color:var(--text-2);max-width:60ch}
.head-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);color:var(--lcd);border:1px solid rgba(166,227,110,.35);border-radius:999px;padding:3px 10px;background:rgba(166,227,110,.06)}
.ro::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lcd)}
.read{font-family:var(--mono);font-size:var(--f-12);color:var(--muted)}
.btn{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:var(--r-2);border:1px solid var(--line-2);background:var(--panel-2);color:var(--text-2);font-size:var(--f-13)}

/* 通用件 */
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);padding:2px 8px;border-radius:var(--r-1);background:var(--panel-3);color:var(--text-2);border:1px solid var(--line);white-space:nowrap}
.chip.my{color:var(--lcd);border-color:rgba(166,227,110,.3);background:rgba(166,227,110,.07)}
.chip.p{font-family:var(--mono);color:var(--violet);border-color:rgba(168,145,255,.3);background:rgba(168,145,255,.08)}
.st-ok{--s:var(--lcd)}.st-warn{--s:var(--yellow)}.st-unk{--s:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--s);box-shadow:0 0 8px color-mix(in srgb,var(--s) 60%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--f-12);padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--s) 45%,transparent);color:var(--s);background:color-mix(in srgb,var(--s) 9%,transparent);white-space:nowrap}
.src{font-family:var(--mono);font-size:11.5px;color:var(--faint);line-height:1.5}
.src b{font-weight:400;color:var(--muted)}
.note{font-size:var(--f-12);color:var(--faint)}
.muted{color:var(--muted)}
h2.sec{font-size:var(--f-16);font-weight:600;margin:0}
.secbar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pxlabel{font-family:var(--pixel);font-size:11px;letter-spacing:.12em;color:var(--tint)}

/* 指令阅读器 */
.reader{display:grid;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--field)}
.toc{border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px;padding:10px;background:#09101e}
.toc button{display:flex;gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:var(--r-1);font-size:var(--f-13);color:var(--text-2);min-height:32px;min-width:0}
.toc button:hover{background:var(--panel-2)}
.toc button[aria-current="true"]{background:var(--panel-3);color:var(--text)}
.toc button span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc .chip.p{padding:0 5px;font-size:10.5px}
.doc{padding:16px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.doc-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.doc pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.75;color:var(--text-2);white-space:pre-wrap;word-break:break-word;background:#060b16;border:1px solid var(--line);border-radius:var(--r-2);padding:14px 16px}
.doc pre .h{color:var(--orange-2)}.doc pre .mask{color:var(--yellow);background:rgba(255,209,102,.1);border-radius:3px;padding:0 3px}.doc pre .cmt{color:var(--faint)}
.wl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wl div{border:1px dashed var(--line-2);border-radius:var(--r-2);padding:10px 12px;font-size:var(--f-12);color:var(--muted);min-width:0}
.wl b{display:block;color:var(--text-2);font-weight:500;margin-bottom:4px;font-size:var(--f-13)}

/* 档案下半部（三版共用） */
.c-cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h4{margin:0;font-size:var(--f-14);font-weight:600;display:flex;align-items:center;gap:8px}
.card h4 .lbl{margin-left:auto}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:var(--f-13);margin:0}
.kv dt{color:var(--faint)}.kv dd{margin:0;color:var(--text-2);min-width:0;overflow-wrap:anywhere}
.list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:var(--f-13)}
.list li{display:flex;gap:8px;align-items:baseline;min-width:0}
.list .mono{font-size:12px;color:var(--text-2)}
.list .who{font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dossier{display:flex;flex-direction:column;gap:16px;min-width:0}

/* 额度条（彩色版） */
.gauges{display:grid;gap:10px;min-width:0}
.gauge{display:grid;grid-template-columns:72px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:var(--f-12);color:var(--muted)}
.gauge .seg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:12px}
.gauge .seg i{background:#162038;border-radius:1px}.gauge .seg i.on{background:var(--s)}
.gauge .pct{font-family:var(--pixel);font-size:13px;color:var(--text);text-align:right}
.gauge .rs{grid-column:2/4;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:-6px}

/* ================= C1 立绘档案 ================= */
.c1{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.roster{display:flex;flex-direction:column;gap:8px;position:sticky;top:76px}
.roster button{--tint:var(--orange);display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:8px 10px 8px 8px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);min-width:0}
.roster button[aria-selected="true"]{border-color:var(--tint);background:linear-gradient(90deg,color-mix(in srgb,var(--tint) 14%,var(--panel)),var(--panel))}
.roster b{display:block;font-size:var(--f-14);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{width:52px;height:52px;border-radius:9px;background:radial-gradient(90% 90% at 60% 30%,color-mix(in srgb,var(--tint) 22%,transparent),transparent 70%),#070c18;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 35%,transparent);display:grid;place-items:center;overflow:hidden}
.roster button:not([aria-selected="true"]) .ava canvas{filter:saturate(.7) brightness(.85)}
.legend{font-size:11.5px;color:var(--faint);padding:6px 4px;display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hero1{--tint:var(--orange);display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:stretch;padding:16px;border-radius:var(--r-l);background:linear-gradient(110deg,color-mix(in srgb,var(--tint) 11%,#101a30) 0%,#0e1628 50%,#0b1222 100%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 22%,transparent),0 18px 40px -26px #000}
.portrait{position:relative;border-radius:var(--r);background:radial-gradient(70% 55% at 50% 58%,color-mix(in srgb,var(--tint) 20%,transparent),transparent 70%),linear-gradient(180deg,#0a1222,#060a14);box-shadow:inset 0 0 0 1px var(--line-2);padding:18px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.portrait::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.portrait .corner{position:absolute;width:14px;height:14px;border-color:var(--line-3);border-style:solid}
.corner.tl{top:8px;left:8px;border-width:2px 0 0 2px}.corner.tr{top:8px;right:8px;border-width:2px 2px 0 0}.corner.bl{bottom:8px;left:8px;border-width:0 0 2px 2px}.corner.br{bottom:8px;right:8px;border-width:0 2px 2px 0}
.stage1{height:268px;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.stage1::after{content:"";position:absolute;left:12%;right:12%;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tint) 70%,transparent),transparent)}
.idle canvas{animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.portrait h3{margin:6px 0 0;font-size:24px;font-weight:650;letter-spacing:.02em;align-self:flex-start;position:relative}
.portrait .pxlabel{align-self:flex-start;position:relative}
.ident{display:flex;flex-direction:column;gap:10px;min-width:0}
.ident h3{margin:0;font-size:var(--f-28);line-height:1.15;font-weight:650}
.ident p{margin:0;color:var(--text-2)}
.ident .meta{display:flex;flex-wrap:wrap;gap:8px}
.ident .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ident-r{display:flex;flex-direction:column;gap:14px;min-width:0;padding-block:6px}
.ident .facts div{background:rgba(6,10,20,.55);border:1px solid var(--line);border-radius:var(--r-2);padding:10px 12px;min-width:0}
.ident .facts b{display:block;font-family:var(--pixel);font-weight:400;font-size:18px;line-height:1.2;color:var(--text)}
.ident .facts span{font-size:11.5px;color:var(--muted)}
.gbox{background:#070c18;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

/* ================= C2 列队待命 ================= */
.lineup{position:relative;border-radius:var(--r-l);overflow:hidden;background:radial-gradient(60% 80% at 50% 120%,rgba(77,227,255,.10),transparent 70%),linear-gradient(180deg,#0b1324 0%,#08101f 70%,#0d1830 100%);box-shadow:var(--m-panel-edge);padding:18px 18px 0}
.lineup-h{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.lineup-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.slot{--tint:var(--orange);position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 14px;border-radius:var(--r) var(--r) 0 0;text-align:center;min-width:0;transition:background .2s}
.slot .fig{height:150px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.slot .fig::before{content:"";position:absolute;left:50%;bottom:-6px;width:120px;height:14px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)}
.slot:not([aria-selected="true"]) .fig canvas{filter:grayscale(.55) brightness(.55)}
.slot[aria-selected="true"]{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--tint) 14%,transparent))}
.slot[aria-selected="true"]::before{content:"";position:absolute;inset:0 18% auto;height:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 18%,transparent),transparent 60%);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);pointer-events:none}
.slot .tag{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%}
.slot .tag b{font-size:var(--f-14);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .tag small{font-family:var(--pixel);font-size:10px;letter-spacing:.1em;color:var(--tint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .lamp{position:absolute;top:10px;right:12px}
.slot[aria-selected="true"] .tag b{color:var(--text)}
.slot:not([aria-selected="true"]) .tag b{color:var(--muted)}
.floor{height:16px;margin:0 -18px;background:linear-gradient(180deg,#14223d,#0b1426);border-top:1px solid var(--line-3)}
.floor-mark{position:relative;height:3px;margin-top:-3px}
.c2-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:stretch}
.c2-id{--tint:var(--orange);display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:center;padding:16px 18px;border-radius:var(--r-l);background:linear-gradient(110deg,color-mix(in srgb,var(--tint) 11%,#101a30),#0c1426 60%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 22%,transparent)}
.c2-id .mini{width:120px;height:120px;border-radius:var(--r);background:#070c18;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 35%,transparent);display:grid;place-items:center;overflow:hidden}
.c2-id h3{margin:0;font-size:24px;font-weight:650}
.c2-id p{margin:6px 0 0;color:var(--text-2)}

/* ================= C3 暴龙机屏 ================= */
.c3{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.lcdlist{display:flex;flex-direction:column;gap:8px;position:sticky;top:76px}
.lcdlist button{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:6px;border-radius:var(--r);background:var(--hw-deep);border:1px solid var(--line);min-width:0}
.lcdlist button[aria-selected="true"]{border-color:var(--lcd);box-shadow:0 0 0 3px rgba(166,227,110,.12)}
.lcdlist .mini-lcd{width:56px;height:48px;border-radius:6px;background:var(--lcd-screen);box-shadow:inset 0 0 0 2px var(--hw-pit),inset 0 3px 8px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden;position:relative}

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill=(st,t)=>`<span class="pill ${S[st]}"><span class="dot"></span>${esc(t)}</span>`;
const dot=st=>`<span class="dot ${S[st]}"></span>`;
const chips=(a,c='')=>a.map(x=>`<span class="chip ${c}">${esc(x)}</span>`).join('');
const qc=st=>({ok:'var(--lcd)',warn:'var(--yellow)',unk:'var(--faint)'})[st];
const charOf=a=>CHAR[a.id];
/* 画布占位：渲染后由 hydrate() 按 data-* 画像素 */
function spr(a,{scale=4,crop=false,mode='color',max=null,own=false}={}){
  const c=charOf(a); const key=c?c.key:'egg';
  const sc=own&&c?c.s:scale;
  return `<canvas class="spr" data-key="${key}" data-scale="${sc}" data-mode="${mode}"${crop&&c?` data-crop="${c.head.join(',')}"`:''}${max?` data-max="${max}"`:''} role="img" aria-label="${c?c.name:'数码蛋'}"></canvas>`;
}
function lum(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;return .299*r+.587*g+.114*b;}
function hydrate(root){
  root.querySelectorAll('canvas.spr').forEach(cv=>{
    const s=SPR[cv.dataset.key]; const f=s.frames[0]; let x0=0,y0=0,w=f[0].length,h=f.length;
    if(cv.dataset.crop){[x0,y0,w,h]=cv.dataset.crop.split(',').map(Number);}
    let sc=+cv.dataset.scale; if(cv.dataset.max){const m=+cv.dataset.max; sc=Math.max(1,Math.floor(m/Math.max(w,h)));}
    cv.width=w*sc; cv.height=h*sc; const x=cv.getContext('2d');
    const lcd=cv.dataset.mode==='lcd';
    const ink=ch=>{const col=s.palette[ch]; if(!col) return null; if(!lcd) return col; const L=lum(col); return L<70?'#1c2616':L<150?'#3d4a2c':L<215?'#6f7d58':null;};
    for(let j=0;j<h;j++){const row=f[y0+j]||'';for(let i=0;i<w;i++){const ch=row[x0+i];if(!ch||ch==='.')continue;const col=ink(ch);if(!col)continue;x.fillStyle=col;x.fillRect(i*sc,j*sc,sc,sc);}}
  });
}

<span class="cmt">…… 原型不放正文（23 行）。正式页面显示全文。</span>`
};
let SEL='claude', TOC=0, V='1';
function reader(a){
  if(!a.instr) return `<div class="card"><span class="lbl">全局指令</span><p class="muted" style="margin:0">本机没有 ${esc(a.name)} 的指令文件。它的行为由对方平台和送审时附带的说明决定，数码世界不读取。</p></div>`;
  const i=a.instr;
  return `<div class="reader"><nav class="toc" aria-label="指令目录">${i.toc.map((t,k)=>`<button type="button" data-toc="${k}" aria-current="${k===TOC}"><span>${t[0]}${esc(t[1])}</span>${t[2]?`<span class="chip p">${t[2]}</span>`:''}</button>`).join('')}</nav>
    <div class="doc"><div class="doc-meta"><span class="mono" style="font-size:12.5px">${esc(i.path)}</span><span class="note num">${i.lines} 行 · 更新于 ${i.updated}</span>${pill(i.sync[0],i.sync[1])}</div>
      <pre>${EXCERPT[a.id]||''}</pre><div class="src"><b>来源</b> ${esc(i.origin)}</div>
      ${a.skipped?`<div class="wl"><div><b>按白名单读取</b>只读指令、模型名、Skill 目录、MCP 名字和运行状态文件。</div><div><b>不读取</b>${a.skipped.map(esc).join('、')}</div></div>`:''}</div></div>`;
}
function sideCards(a){
  return `<div class="card"><h4>模型<span class="lbl">MODEL</span></h4><dl class="kv"><dt>主模型</dt><dd class="mono">${esc(a.model.main)}</dd>${a.model.id?`<dt>说明</dt><dd>${esc(a.model.id)}</dd>`:''}${a.model.perm?`<dt>权限</dt><dd>${esc(a.model.perm)}${a.model.deny?` · 拒绝规则 ${a.model.deny} 条`:''}</dd>`:''}</dl><span class="src">${esc(a.model.note)}</span></div>
  <div class="card"><h4>Skill<span class="lbl">${a.skills?a.skills.total+' 个':'未知'}</span></h4>${a.skills?`<ul class="list">${a.skills.parts.map(p=>`<li><span>${esc(p[0])}</span><span class="who num mono">${p[1]}</span></li>`).join('')}</ul>${a.skills.mineList.length?`<div class="chips">${chips(a.skills.mineList,'my')}</div>`:'<span class="note">没有装 my-skills 的 Skill</span>'}`:'<span class="muted" style="font-size:13px">本机读不到</span>'}</div>
  <div class="card"><h4>MCP<span class="lbl">${a.mcp?a.mcp.length+' 个':'未知'}</span></h4>${a.mcp?`<div class="chips">${chips(a.mcp)}</div><span class="src">只读名字，不读连接参数</span>`:'<span class="muted" style="font-size:13px">本机读不到</span>'}</div>
  <div class="card"><h4>Hook<span class="lbl">${a.hooks.length?a.hooks.length+' 组':'未读取'}</span></h4>${a.hooks.length?`<ul class="list">${a.hooks.map(h=>`<li style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px"><span class="mono">${esc(h[0])}</span><span class="who">${esc(h[2])}</span><span class="note" style="grid-column:1/-1">${esc(h[1])}</span></li>`).join('')}</ul>`:'<span class="muted" style="font-size:13px">原型未接入</span>'}</div>
  <div class="card"><h4>来源与读取时间</h4><ul class="list">${a.src.map(s=>`<li style="display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px"><span class="muted">${s[0]}</span><span class="mono" style="overflow-wrap:anywhere">${esc(s[1])}</span><span class="who mono num">${s[2]}</span></li>`).join('')}</ul>${a.skipped?`<span class="src"><b>不读取</b> ${a.skipped.map(esc).join('、')}</span>`:''}</div>`;
}
function lower(a){
  return `<div class="c-cols"><div class="stack"><div class="secbar"><h2 class="sec">全局指令</h2>${a.instr&&a.instr.prefs.length?'<span class="note">紫色编号＝这一节对应 Vault 里的个人偏好</span>':a.instr?`<span class="note">${esc(a.instr.prefNote)}</span>`:''}</div>${reader(a)}</div><div class="stack">${sideCards(a)}</div></div>`;
}
function gauge(r){const on=Math.round(Math.min(100,r[1])/5);return `<div class="gauge" style="--s:${qc(r[2])}"><span>${r[0]}</span><div class="seg" aria-hidden="true">${Array.from({length:20},(_,k)=>`<i class="${k<on?'on':''}"></i>`).join('')}</div><span class="pct">${r[1]}%</span><span class="rs">${r[3]}</span></div>`;}
function gauges(a){
  if(a.quota) return a.quota.rows.map(gauge).join('')+`<span class="src"><b>${a.quota.plan}</b>${a.quota.extra?' · '+a.quota.extra:''} · 来源 驿窗 HUD</span>`;
  if(a.online) return `<div class="gauge" style="--s:var(--lcd)"><span>网关</span><div class="seg">${'<i class="on"></i>'.repeat(20)}</div><span class="pct">ON</span><span class="rs">${esc(a.online)} · 22:53</span></div><span class="src">额度：没有接入可核验的来源，不显示</span>`;
  return `<div class="gauge" style="--s:var(--faint)"><span>额度</span><div class="seg">${'<i></i>'.repeat(20)}</div><span class="pct" style="color:var(--faint)">—</span><span class="rs">未知：本机没有可核验的来源</span></div>`;
}
const cname=a=>charOf(a)?charOf(a).name:'未分配形象';
const facts3=a=>[[a.skills?a.skills.total:'—','Skill'],[a.skills?a.skills.mine+'/15':'—','来自 my-skills'],[a.mcp?a.mcp.length:'—','MCP']];

/* ---------- C1 立绘档案：形象做主视觉，像角色卡 ---------- */
function v1(){
  const a=AG.find(x=>x.id===SEL);
  const roster=AG.map(x=>`<button type="button" role="tab" aria-selected="${x.id===SEL}" data-sel="${x.id}" style="--tint:${x.tint}"><span class="ava">${spr(x,{crop:true,scale:2,max:charOf(x)?null:40})}</span><span style="min-width:0"><b>${esc(x.name)}</b><small>${esc(cname(x))}</small></span>${dot(x.status[0])}</button>`).join('');
  return `<div class="c1"><div class="roster" role="tablist" aria-label="选择 Agent">${roster}<div class="legend"><span>${dot('ok')}正常</span><span>${dot('warn')}要看一眼</span><span>${dot('unk')}未知</span></div></div>
   <div class="dossier">
    <section class="hero1" style="--tint:${a.tint}" aria-label="${esc(a.name)} 档案">
      <div class="portrait"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="stage1 idle">${spr(a,{own:true,scale:8})}</div>
        <h3>${esc(cname(a))}</h3><span class="pxlabel">${esc(a.en)} · ${esc(a.role)}</span></div>
      <div class="ident-r"><div class="ident"><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p>
        <div class="meta"><span class="chip">${esc(a.entry)}</span>${pill(a.status[0],a.status[1])}</div>
        <dl class="kv" style="margin-top:4px"><dt>模型</dt><dd class="mono">${esc(a.model.main)}${a.model.id?` <span class="muted">· ${esc(a.model.id)}</span>`:''}</dd><dt>指令</dt><dd>${a.instr?`<span class="mono">${esc(a.instr.path)}</span> · ${a.instr.lines} 行`:'本机无'}</dd></dl>
        <div class="facts">${[[a.hooks.length?a.hooks.length:'—','Hook 组'],...facts3(a)].map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div></div>
      <div class="gbox"><span class="lbl">运行</span>${gauges(a)}</div></div>
    </section>${lower(a)}</div></div>`;
}

/* ---------- C2 列队待命：全员同台，点谁谁上前 ---------- */
function v2(){
  const a=AG.find(x=>x.id===SEL);
  const slots=AG.map(x=>`<button type="button" class="slot" role="tab" aria-selected="${x.id===SEL}" data-sel="${x.id}" style="--tint:${x.tint}"><span class="lamp">${dot(x.status[0])}</span><span class="fig${x.id===SEL?' idle':''}">${spr(x,{scale:charOf(x)?(x.id==='hermes'?3:2):4})}</span><span class="tag"><b>${esc(cname(x))}</b><small>${esc(x.en)}</small></span></button>`).join('');
  return `<div class="dossier"><section class="lineup" aria-label="Agent 列队"><div class="lineup-h"><span class="lbl">SELECT · 选一位看档案</span><span class="note">亮着的是当前选中；右上角灯是运行状态</span></div>
      <div class="lineup-row" role="tablist">${slots}</div><div class="floor"></div></section>
    <div class="c2-body"><section class="c2-id" style="--tint:${a.tint}" aria-label="${esc(a.name)} 档案"><span class="mini">${spr(a,{crop:true,scale:4,max:charOf(a)?null:100})}</span>
        <div style="min-width:0"><span class="pxlabel">${esc(cname(a))} · ${esc(a.en)}</span><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p>
        <div class="chips" style="margin-top:10px"><span class="chip">${esc(a.role)}</span><span class="chip">${esc(a.entry)}</span><span class="chip mono">${esc(a.model.main)}</span>${pill(a.status[0],a.status[1])}</div></div></section>
      <div class="gbox"><span class="lbl">运行</span>${gauges(a)}</div></div>
    ${lower(a)}</div>`;
}

/* ---------- C3 暴龙机屏：形象住在液晶屏里，读数也上屏 ---------- */
function lcdBars(a){
  const cell=(pct,w)=>Array.from({length:16},(_,k)=>`<i class="${k<Math.round(Math.min(100,pct)/6.25)?'on'+(w?' w':''):''}"></i>`).join('');
  if(a.quota) return a.quota.rows.map(r=>`<div class="bar"><span>${r[4]}</span><div class="cells">${cell(r[1],r[2]!=='ok')}</div><span>${r[2]!=='ok'?'??':Math.round(r[1])+'%'}</span></div>`).join('');
  if(a.online) return `<div class="bar"><span>NET</span><div class="cells">${cell(100)}</div><span>ON</span></div><div class="bar"><span>QTA</span><div class="cells">${cell(0)}</div><span>--</span></div>`;
  return `<div class="bar"><span>NET</span><div class="cells">${cell(0)}</div><span>--</span></div><div class="bar"><span>QTA</span><div class="cells">${cell(0)}</div><span>--</span></div>`;
}
function v3(){
  const a=AG.find(x=>x.id===SEL);
  const list=AG.map(x=>`<button type="button" role="tab" aria-selected="${x.id===SEL}" data-sel="${x.id}"><span class="mini-lcd">${spr(x,{crop:true,scale:2,mode:'lcd',max:charOf(x)?null:40})}</span><span style="min-width:0"><b>${esc(x.name)}</b><small>${dot(x.status[0])} ${esc(cname(x))}</small></span></button>`).join('');
  const stLcd=a.status[0]==='ok'?'OK':a.status[0]==='warn'?'CHECK':'UNKNOWN';
  return `<div class="c3"><div class="lcdlist" role="tablist" aria-label="选择 Agent">${list}</div>
   <div class="dossier"><section class="hero3" aria-label="${esc(a.name)} 档案">
     <div class="device"><div class="device-top"><span><i></i>DIGIVICE · AGENT</span><span>${esc(a.en)}</span></div>
       <div class="screen"><div class="row"><span>${esc(charOf(a)?a.en:'NO PARTNER')}</span><span>${stLcd}</span></div>
         <div class="stage3 idle">${spr(a,{mode:'lcd',max:charOf(a)?null:150,scale:charOf(a)?3:6})}</div>
         <div class="bars">${lcdBars(a)}</div></div>
       <div class="keys" aria-hidden="true"><span></span><span></span><span></span></div></div>
     <div class="c3-id"><div class="namecard" style="--tint:${a.tint}"><span class="pxlabel">${esc(cname(a))}</span><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p>
         <div class="chips"><span class="chip">${esc(a.role)}</span><span class="chip">${esc(a.entry)}</span>${pill(a.status[0],a.status[1])}</div></div>
       <div class="readouts">${[[a.model.main,'模型'],...facts3(a)].slice(0,3).map(f=>`<div><b style="${String(f[0]).length>8?'font-size:15px':''}">${esc(f[0])}</b><span>${f[1]}</span></div>`).join('')}</div>
       <div class="gbox"><span class="lbl">运行 · 屏上读数的明细</span>${gauges(a)}</div></div>
   </section>${lower(a)}</div></div>`;
}

const NOTES={
 '1':'11-07 已定：C「单个档案」+ C1 立绘档案；只列本机有配置的 4 个 Agent，ChatGPT 不计入。',
 '2':'形象做选择器：5 位同台列队，点谁谁亮起上前；下面是它的档案。一眼看到整个团队，适合常在几个 Agent 之间切换。',
 '3':'形象住在暴龙机液晶屏里：单色像素加屏上读数（额度、在线），和左下角伙伴屏、首页暴龙机是一套语言。'
};
function render(){
  document.querySelectorAll('.proto-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===V)));
  $('#proto-note').textContent=NOTES[V];
  const view=$('#view'); view.innerHTML=V==='1'?v1():V==='2'?v2():v3(); hydrate(view);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.v){V=t.dataset.v;history.replaceState(null,'','#c'+V);render();window.scrollTo({top:0});}
  else if(t.dataset.sel){SEL=t.dataset.sel;TOC=0;render();}
  else if(t.dataset.toc){TOC=+t.dataset.toc;t.closest('.toc').querySelectorAll('button').forEach(x=>x.setAttribute('aria-current',String(x===t)));}
  else if(t.id==='refresh'){t.textContent='已重新读取 · 原型不联动';setTimeout(()=>t.textContent='重新读取',1600);}
});
function fromHash(){const h=location.hash.slice(1);if(['c1','c2','c3'].includes(h))V=h.slice(1);render();}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
